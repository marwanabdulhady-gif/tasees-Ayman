name: Fetch YouTube transcripts

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Playlist folder to fetch (blank = all five)"
        required: false
        type: string
      limit:
        description: "Max episodes per playlist (blank = all)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fetch-transcripts-${{ github.ref }}
  cancel-in-progress: false

# Manual only: cloud runners are normally refused by YouTube's bot check, so an
# automatic run on every push just burns minutes and commits failure reports.

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      YT_COOKIES_FILE: ${{ github.workspace }}/../cookies.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Write cookies (optional)
        if: ${{ env.YT_COOKIES != '' }}
        run: printf '%s' "$YT_COOKIES" > "$YT_COOKIES_FILE"

      - name: Fetch transcripts
        env:
          ONLY: ${{ inputs.only }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--only $ONLY); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          python scripts/fetch_transcripts.py "${args[@]}"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcripts
          if git diff --cached --quiet; then
            echo "No new transcripts."
          else
            git commit -m "Add YouTube transcripts"
            git push
          fi

      - name: Show status
        if: always()
        run: cat transcripts/_status.md || echo "no status file"

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-run-log
          path: transcripts/_last_run.log
          if-no-files-found: ignore
