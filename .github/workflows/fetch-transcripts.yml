name: Fetch YouTube transcripts

on:
  workflow_dispatch:
    inputs:
      supadata_key:
        description: Supadata API key (only if the SUPADATA_API_KEY secret is not set)
        required: false
  push:
    paths:
      - transcripts/playlists.json
      - scripts/fetch_transcripts.py
      - .github/workflows/fetch-transcripts.yml

permissions:
  contents: write

concurrency:
  group: fetch-transcripts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
      YT_COOKIES_FILE: ${{ github.workspace }}/../cookies.txt
    steps:
      - uses: actions/checkout@v4

      - name: Use Supadata key from run input (masked)
        run: |
          key=$(jq -r '.inputs.supadata_key // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$key" ] && [ -z "$SUPADATA_API_KEY" ]; then
            echo "::add-mask::$key"
            echo "SUPADATA_API_KEY=$key" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Write cookies (optional)
        if: ${{ env.YT_COOKIES != '' }}
        run: printf '%s' "$YT_COOKIES" > "$YT_COOKIES_FILE"

      - name: Fetch transcripts
        run: python scripts/fetch_transcripts.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcripts
          if git diff --cached --quiet; then
            echo "No new transcripts."
          else
            git commit -m "Add YouTube transcripts"
            git push
          fi
