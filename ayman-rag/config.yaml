# Every setting the pipeline reads lives here, so you can experiment
# (change chunk size, swap models) without touching the code.

data:
  # Ayman's transcripts already live in the course repo, one folder per playlist.
  transcripts_dir: ../transcripts
  # Generated by `python main.py ingest`. Not committed.
  chunks_file: data/chunks.jsonl

chunking:
  # Stage 1 experiment: try 200 and 800 and compare search results.
  chunk_words: 400
  overlap_words: 50

retrieval:
  top_k: 5
  # Stage 2: "bm25". Stage 3: "vector" or "hybrid".
  method: bm25

embeddings:
  # Stage 3. Multilingual models that handle Arabic well.
  model: BAAI/bge-m3
  index_file: data/vectors.npy

llm:
  # Stage 4. "anthropic" (needs ANTHROPIC_API_KEY in .env) or "ollama" (free, local).
  provider: anthropic
  model: claude-haiku-5-5
  ollama_model: qwen2.5:7b
  max_tokens: 800

logging:
  file: logs/app.log
  level: INFO
