<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Cairo, sans-serif">
<rect width="1200" height="675" fill="#0e1b2e"/>
<text x="600" y="52" fill="#e8f1f8" font-size="32" text-anchor="middle" font-weight="bold">العصر الذهبي وتشريح الانحدار: البذور بتتزرع في الذروة</text>
<g font-size="18" text-anchor="middle" fill="#e8f1f8">
<rect x="55" y="92" width="215" height="116" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/>
<text x="162" y="122" fill="#e8f1f8" font-size="18" text-anchor="middle" >الترجمة النقدية</text>
<text x="162" y="152" fill="#bcd6e6" font-size="13" text-anchor="middle" >الطب والرياضيات والمنطق — </text>
<text x="162" y="172" fill="#bcd6e6" font-size="13" text-anchor="middle" >والخيمياء مرفوضة (Q7)</text>
<text x="162" y="192" fill="#bcd6e6" font-size="13" text-anchor="middle" ></text>
<rect x="277" y="92" width="215" height="116" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/>
<text x="384" y="122" fill="#e8f1f8" font-size="18" text-anchor="middle" >الورق بعد طلاس ١٣٣هـ</text>
<text x="384" y="152" fill="#bcd6e6" font-size="13" text-anchor="middle" >أرخص من الرق — «مطبعة» قبل</text>
<text x="384" y="172" fill="#bcd6e6" font-size="13" text-anchor="middle" > جوتنبرج بستميت سنة</text>
<text x="384" y="192" fill="#bcd6e6" font-size="13" text-anchor="middle" ></text>
<rect x="499" y="92" width="215" height="116" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/>
<text x="606" y="122" fill="#e8f1f8" font-size="18" text-anchor="middle" >بيت الحكمة</text>
<text x="606" y="152" fill="#bcd6e6" font-size="13" text-anchor="middle" >المعرفة مشروع دولة — الرشي</text>
<text x="606" y="172" fill="#bcd6e6" font-size="13" text-anchor="middle" >د والمأمون</text>
<text x="606" y="192" fill="#bcd6e6" font-size="13" text-anchor="middle" ></text>
<rect x="721" y="92" width="215" height="116" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/>
<text x="828" y="122" fill="#e8f1f8" font-size="18" text-anchor="middle" >تعدد المراكز</text>
<text x="828" y="152" fill="#bcd6e6" font-size="13" text-anchor="middle" >قرطبة وبخارى والقاهرة — لو</text>
<text x="828" y="172" fill="#bcd6e6" font-size="13" text-anchor="middle" > سقط مركز فالباقي شايل</text>
<text x="828" y="192" fill="#bcd6e6" font-size="13" text-anchor="middle" ></text>
<rect x="943" y="92" width="215" height="116" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/>
<text x="1050" y="122" fill="#e8f1f8" font-size="18" text-anchor="middle" >النقل للغرب (Q8)</text>
<text x="1050" y="152" fill="#bcd6e6" font-size="13" text-anchor="middle" >الأندلس وصقلية — أحد جذور </text>
<text x="1050" y="172" fill="#bcd6e6" font-size="13" text-anchor="middle" >نهضة أوروبا</text>
<text x="1050" y="192" fill="#bcd6e6" font-size="13" text-anchor="middle" ></text>
</g>
<text x="600" y="248" fill="#e8f1f8" font-size="21" text-anchor="middle" font-weight="bold">بذور الانحدار الثلاث</text>
<rect x="55" y="268" width="1090" height="84" rx="12" fill="#123a5c" stroke="#f2b134" stroke-width="3"/>
<text x="145" y="302" fill="#e8f1f8" font-size="19" text-anchor="middle" >١ التوريث المزدوج</text>
<text x="660" y="298" fill="#bcd6e6" font-size="15" text-anchor="middle" >ترتيب الرشيد ← صراع الإخوة ← حصار بغداد سنة كاملة ١٩٨هـ — أسوأ ق</text>
<text x="660" y="322" fill="#bcd6e6" font-size="15" text-anchor="middle" >رار بتاخده وإنت قوي: قرار الخلافة من بعدك</text>
<rect x="55" y="364" width="1090" height="84" rx="12" fill="#123a5c" stroke="#f2b134" stroke-width="3"/>
<text x="145" y="398" fill="#e8f1f8" font-size="19" text-anchor="middle" >٢ المحنة ٢١٨هـ</text>
<text x="660" y="394" fill="#bcd6e6" font-size="15" text-anchor="middle" >الدولة تفرض اللاهوت بالامتحان والسجن — وأحمد بن حنبل نموذج العال</text>
<text x="660" y="418" fill="#bcd6e6" font-size="15" text-anchor="middle" >م أمام السلطان: صمود بلا سيف ولا مداهنة</text>
<rect x="55" y="460" width="1090" height="84" rx="12" fill="#123a5c" stroke="#e05252" stroke-width="3"/>
<text x="145" y="494" fill="#e8f1f8" font-size="19" text-anchor="middle" >٣ العسكر</text>
<text x="660" y="490" fill="#bcd6e6" font-size="15" text-anchor="middle" >المعتصم والأترك وسامراء — «لبي صرخة امرأة وسلّم البلاد للعسكر» —</text>
<text x="660" y="514" fill="#bcd6e6" font-size="15" text-anchor="middle" > قتل المتوكل ٢٤٧هـ: الخليفة رمز والسلطة للجيش</text>
<rect x="55" y="560" width="1090" height="58" rx="12" fill="#0f2740" stroke="#0f2740" stroke-width="0"/>
<text x="600" y="584" fill="#e8f1f8" font-size="18" text-anchor="middle" >تفكيك «قرن الهيمنة»: مين سماها؟ بتبرز نخبًا حاكمة وبتخفي جمهورًا سنيًا وازدهارًا علميًا — البديل الأدق: «قرن تعدد المراكز»</text>
<text x="600" y="608" fill="#bcd6e6" font-size="16" text-anchor="middle" >الرموز بتعيش أطول من الجيوش: البويهيون حكموا باسم الخلافة السنية — والأزهر الفاطمي بقى أعظم مؤسسة سنية في العالم</text>
<text x="600" y="640" fill="#7fa3bb" font-size="20" text-anchor="middle">مشروع تأسيس — الوحدة 6 v0.4 — الأسبوع 24 — بلا تجسيد</text>
</svg>
