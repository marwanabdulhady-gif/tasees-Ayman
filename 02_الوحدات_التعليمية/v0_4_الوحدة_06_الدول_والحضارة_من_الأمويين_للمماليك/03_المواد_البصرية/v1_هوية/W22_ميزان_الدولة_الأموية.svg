<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'IBM Plex Sans Arabic', 'Noto Sans Arabic', Tahoma, sans-serif"><defs><pattern id="v1grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" fill="none" stroke="#D7DDE8" stroke-width="0.7"/></pattern></defs>
<rect width="1200" height="675" fill="#F7F8F3"/><rect width="1200" height="675" fill="url(#v1grid)"/>
<text x="600" y="52" fill="#19213A" font-size="32" text-anchor="middle" font-weight="bold">ميزان الدولة الأموية (٤١–١٣٢هـ): إنجاز وجريمة في سجل واحد</text>
<text x="600" y="84" fill="#4A5470" font-size="19" text-anchor="middle" >«إني لا أضع سيفي حيث يكفيني سوطي» — الحِلم عقيدة إدارة لا مجاملة</text>
<rect x="60" y="104" width="520" height="230" rx="6" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="3"/>
<text x="320" y="134" fill="#19213A" font-size="24" text-anchor="middle" font-weight="bold">كفة الإنجاز</text>
<text x="320" y="172" fill="#4A5470" font-size="17" text-anchor="middle" >تعريب الدواوين — هوية إدارية (عبد الملك)</text>
<text x="320" y="202" fill="#4A5470" font-size="17" text-anchor="middle" >العملة الإسلامية: دينار ٧٧هـ — استقلال اقتصادي</text>
<text x="320" y="232" fill="#4A5470" font-size="17" text-anchor="middle" >البريد والتنظيم — دولة إدارة</text>
<text x="320" y="262" fill="#4A5470" font-size="17" text-anchor="middle" >أقصى توسع: عقبة بالمغرب وخراسان والأندلس والسند</text>
<text x="320" y="292" fill="#4A5470" font-size="17" text-anchor="middle" >قبة الصخرة ٦٦–٧٢هـ — أول تحفة معمارية باقية</text>
<rect x="620" y="104" width="520" height="230" rx="6" fill="#FFFFFF" stroke="#C23B30" stroke-width="3"/>
<text x="880" y="134" fill="#19213A" font-size="24" text-anchor="middle" font-weight="bold">كفة الصفحات السوداء</text>
<text x="880" y="172" fill="#4A5470" font-size="17" text-anchor="middle" >كربلاء ٦١هـ: مقتل الحسين — جريمة بإجماع المسلمين</text>
<text x="880" y="202" fill="#4A5470" font-size="17" text-anchor="middle" >المسؤولية السياسية ليزيد ثابتة — والأمر المباشر محل بحث</text>
<text x="880" y="232" fill="#4A5470" font-size="17" text-anchor="middle" >وقعة الحرة ٦٣هـ: استباحة المدينة بأمر موثق</text>
<text x="880" y="262" fill="#4A5470" font-size="17" text-anchor="middle" >حصار مكة والمنجنيق على الكعبة مرتين (٦٤ و٧٣هـ)</text>
<text x="880" y="292" fill="#4A5470" font-size="17" text-anchor="middle" >سابقة التوريث: الملك العضوض من سنة ٦٠هـ</text>
<rect x="60" y="352" width="1080" height="58" rx="6" fill="#FFFFFF" stroke="#20242C" stroke-width="3" stroke-dasharray="4 3"/>
<text x="600" y="388" fill="#19213A" font-size="18" text-anchor="middle" >عمر بن عبد العزيز المنصة: منع سبّ علي من المنابر وأحل محلها «إن الله يأمر بالعدل والإحسان» — إصلاح الفتنة يبدأ بوقف آلة السب</text>
<rect x="60" y="424" width="1080" height="58" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="0"/>
<text x="600" y="460" fill="#4A5470" font-size="18" text-anchor="middle" >أدب الوحدة: معاوية صحابي — نفحص قراراته السياسية بصرامة، وما نسبّه وما نقدّسه — والحسين له حرمة مضاعفة: الجريمة بحجمها بلا استغلال طائفي</text>
<rect x="60" y="496" width="1080" height="58" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="0"/>
<text x="600" y="532" fill="#4A5470" font-size="18" text-anchor="middle" >الحجاج نموذج البطاقة لا الملصق: إنجازات إدارية موثقة + جرائم دم موثقة — في ميزان واحد، من غير ما يذيب واحد في التاني</text>
<text x="600" y="640" fill="#4A5470" font-size="20" text-anchor="middle">مشروع تأسيس — الوحدة 6 v0.4 — الأسبوع 22 — بلا تجسيد · هوية v1</text>
</svg>
