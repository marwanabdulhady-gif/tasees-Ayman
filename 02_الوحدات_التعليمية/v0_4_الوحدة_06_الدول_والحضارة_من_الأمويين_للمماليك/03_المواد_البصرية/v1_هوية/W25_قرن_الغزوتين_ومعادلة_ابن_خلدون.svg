<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'IBM Plex Sans Arabic', 'Noto Sans Arabic', Tahoma, sans-serif"><defs><pattern id="v1grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" fill="none" stroke="#D7DDE8" stroke-width="0.7"/></pattern></defs>
<rect width="1200" height="675" fill="#F7F8F3"/><rect width="1200" height="675" fill="url(#v1grid)"/>
<text x="600" y="52" fill="#19213A" font-size="31" text-anchor="middle" font-weight="bold">قرن الغزوتين (٤٩٢–٦٥٨هـ): التشقق هو الباب — والحضارة تنتقل</text>
<g font-size="17" text-anchor="middle" fill="#19213A">
<rect x="42" y="90" width="182" height="124" rx="6" fill="#FFFFFF" stroke="#C23B30" stroke-width="3"/>
<text x="133" y="116" fill="#4A5470" font-size="16" text-anchor="middle" >٤٩٢</text>
<text x="133" y="142" fill="#19213A" font-size="17" text-anchor="middle" >القدس تسقط</text>
<text x="133" y="166" fill="#4A5470" font-size="12" text-anchor="middle" >مذبحة موثقة من الطرفين —</text>
<text x="133" y="184" fill="#4A5470" font-size="12" text-anchor="middle" > الرقم (٧٠ ألفًا) محل فح</text>
<text x="133" y="202" fill="#4A5470" font-size="12" text-anchor="middle" >ص</text>
<text x="228" y="156" fill="#4A5470" font-size="22">←</text>
<rect x="236" y="90" width="182" height="124" rx="6" fill="#FFFFFF" stroke="#20242C" stroke-width="3" stroke-dasharray="4 3"/>
<text x="327" y="116" fill="#4A5470" font-size="16" text-anchor="middle" >٥٣٩</text>
<text x="327" y="142" fill="#19213A" font-size="17" text-anchor="middle" >زنكي والرها</text>
<text x="327" y="166" fill="#4A5470" font-size="12" text-anchor="middle" >الرد يبدأ من الأطراف مش </text>
<text x="327" y="184" fill="#4A5470" font-size="12" text-anchor="middle" >العواصم</text>
<text x="327" y="202" fill="#4A5470" font-size="12" text-anchor="middle" ></text>
<text x="422" y="156" fill="#4A5470" font-size="22">←</text>
<rect x="430" y="90" width="182" height="124" rx="6" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="3"/>
<text x="521" y="116" fill="#4A5470" font-size="16" text-anchor="middle" >٥٧٠–٥٨٣</text>
<text x="521" y="142" fill="#19213A" font-size="17" text-anchor="middle" >نور الدين ← صلاح الدين</text>
<text x="521" y="166" fill="#4A5470" font-size="12" text-anchor="middle" >التوحيد قبل التحرير — من</text>
<text x="521" y="184" fill="#4A5470" font-size="12" text-anchor="middle" >بر الأقصى قبل فتحه</text>
<text x="521" y="202" fill="#4A5470" font-size="12" text-anchor="middle" ></text>
<text x="616" y="156" fill="#4A5470" font-size="22">←</text>
<rect x="624" y="90" width="182" height="124" rx="6" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="3"/>
<text x="715" y="116" fill="#4A5470" font-size="16" text-anchor="middle" >٥٨٣</text>
<text x="715" y="142" fill="#19213A" font-size="17" text-anchor="middle" >حطين ← القدس</text>
<text x="715" y="166" fill="#4A5470" font-size="12" text-anchor="middle" >دخلها من غير مذبحة: «لست</text>
<text x="715" y="184" fill="#4A5470" font-size="12" text-anchor="middle" > مثل أولئك القوم»</text>
<text x="715" y="202" fill="#4A5470" font-size="12" text-anchor="middle" ></text>
<text x="810" y="156" fill="#4A5470" font-size="22">←</text>
<rect x="818" y="90" width="182" height="124" rx="6" fill="#FFFFFF" stroke="#C23B30" stroke-width="3"/>
<text x="909" y="116" fill="#4A5470" font-size="16" text-anchor="middle" >٦٥٦</text>
<text x="909" y="142" fill="#19213A" font-size="17" text-anchor="middle" >سقوط بغداد</text>
<text x="909" y="166" fill="#4A5470" font-size="12" text-anchor="middle" >مذبحة هائلة + نهاية خلاف</text>
<text x="909" y="184" fill="#4A5470" font-size="12" text-anchor="middle" >ة — رقم ٨٠٠ ألف: مبالعة </text>
<text x="909" y="202" fill="#4A5470" font-size="12" text-anchor="middle" >ديموغرافية</text>
<text x="1004" y="156" fill="#4A5470" font-size="22">←</text>
<rect x="1012" y="90" width="182" height="124" rx="6" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="3"/>
<text x="1103" y="116" fill="#4A5470" font-size="16" text-anchor="middle" >٦٥٨</text>
<text x="1103" y="142" fill="#19213A" font-size="17" text-anchor="middle" >عين جالوت</text>
<text x="1103" y="166" fill="#4A5470" font-size="12" text-anchor="middle" >قطز وبيبرس — أول هزيمة ح</text>
<text x="1103" y="184" fill="#4A5470" font-size="12" text-anchor="middle" >اسمة للمغول</text>
<text x="1103" y="202" fill="#4A5470" font-size="12" text-anchor="middle" ></text>
</g>
<text x="600" y="252" fill="#19213A" font-size="20" text-anchor="middle" font-weight="bold">معادلة ابن خلدون (المقدمة — ٧٧٩هـ): الدول لها آجال كأجل الأشخاص</text>
<g font-size="18" text-anchor="middle" fill="#19213A">
<rect x="70" y="274" width="205" height="88" rx="6" fill="#FFFFFF" stroke="#20242C" stroke-width="3" stroke-dasharray="4 3"/>
<text x="172" y="310" fill="#19213A" font-size="19" text-anchor="middle" >عصبية</text>
<text x="172" y="338" fill="#4A5470" font-size="14" text-anchor="middle" >(تماسك الأطراف)</text>
<text x="282" y="324" fill="#4A5470" font-size="24">←</text>
<rect x="295" y="274" width="205" height="88" rx="6" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="3"/>
<text x="397" y="310" fill="#19213A" font-size="19" text-anchor="middle" >ملك</text>
<text x="397" y="338" fill="#4A5470" font-size="14" text-anchor="middle" >(الثروة والأمان)</text>
<text x="507" y="324" fill="#4A5470" font-size="24">←</text>
<rect x="520" y="274" width="205" height="88" rx="6" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="3"/>
<text x="622" y="310" fill="#19213A" font-size="19" text-anchor="middle" >ترف</text>
<text x="622" y="338" fill="#4A5470" font-size="14" text-anchor="middle" >(تفكك في ٣ أجيال)</text>
<text x="732" y="324" fill="#4A5470" font-size="24">←</text>
<rect x="745" y="274" width="205" height="88" rx="6" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="3"/>
<text x="847" y="310" fill="#19213A" font-size="19" text-anchor="middle" >فقدان عصبية</text>
<text x="847" y="338" fill="#4A5470" font-size="14" text-anchor="middle" >(الدولة تموت)</text>
<text x="957" y="324" fill="#4A5470" font-size="24">←</text>
<rect x="970" y="274" width="205" height="88" rx="6" fill="#FFFFFF" stroke="#20242C" stroke-width="3" stroke-dasharray="4 3"/>
<text x="1072" y="310" fill="#19213A" font-size="19" text-anchor="middle" >عصبية جديدة</text>
<text x="1072" y="338" fill="#4A5470" font-size="14" text-anchor="middle" >(من الأطراف)</text>
</g>
<rect x="55" y="382" width="1090" height="60" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="0"/>
<text x="600" y="406" fill="#19213A" font-size="17" text-anchor="middle" >تطبيق: أمية (عصبية قريش الشامية ← ترف أواخرها ← خراسان) · العباسية (دعوة ← ترف بغداد ← عسكر مستورد — ملاحظة ابن خلدون: المرتزق ولاؤه للراتب مش للمشروع)</text>
<text x="600" y="430" fill="#4A5470" font-size="16" text-anchor="middle" >المماليك استثناء نسبي (٢٦٧ سنة): السلطان بيتصنع مش بيتورث — النظام بيعيد إنتاج عصبية جديدة كل جيل</text>
<rect x="55" y="452" width="1090" height="60" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="0"/>
<text x="600" y="476" fill="#19213A" font-size="17" text-anchor="middle" >ميزان صلاح الدين: الشهرة مستحقة (مشروع اكتمل + رحمة موثقة + خزانة دينار و٤٧ درهمًا برواية مشهورة) — والتلميع مرفوض (قاتل مسلمين وألغى خلافة)</text>
<text x="600" y="500" fill="#4A5470" font-size="16" text-anchor="middle" >القدوة الحقيقية أعظم من الملاك — لأنها بشر زينا واختار صح في اللحظات الفاصلة</text>
<rect x="55" y="522" width="1090" height="88" rx="6" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="3"/>
<text x="600" y="548" fill="#19213A" font-size="21" text-anchor="middle" font-weight="bold">الدرس الختامي: الدول تسقط والحضارة تنتقل</text>
<text x="600" y="576" fill="#4A5470" font-size="16" text-anchor="middle" >بغداد سقطت ٦٥٦ — والقاهرة بقت عاصمة العالم: ابن تيمية وابن كثير والذهبي وابن حجر — أعظم العلم اتولد تحت ضغط الزلزال</text>
<text x="600" y="600" fill="#4A5470" font-size="16" text-anchor="middle" >الدول أوعية — والأوعية بتتكسر والماء بينسكب في وعاء جديد — والماء ما بيموتش بالسقوط السياسي: بيموت لما يبطل الناس ينقلوه</text>
<text x="600" y="640" fill="#4A5470" font-size="20" text-anchor="middle">مشروع تأسيس — الوحدة 6 v0.4 — الأسبوع 25 — بلا تجسيد · هوية v1</text>
</svg>
