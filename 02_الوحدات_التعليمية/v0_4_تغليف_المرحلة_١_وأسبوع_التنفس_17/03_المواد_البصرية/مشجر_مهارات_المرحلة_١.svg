<rect x="120" y="208" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="242">الاتفاق الموحد: 7 قواعد + 5 مسامير (رقم/كلمة/تاريخ/خبر/سؤال صعب) — تتراكم وحدة فوق وحدة</text>
<rect x="120" y="276" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="310">الملفات الأربعة = رأس المال: تشخيص وحوار · فهرس وخريطة وبطاقة وقيمة · لساني وجذور وقراءة ومشروع · خبر ومحطات وتصنيف وإجابة</text>
<rect x="120" y="344" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="378">الخطوط الحمراء: لا تجسيد · لا نكات على مقدسات/أشخاص · لا درجات على المواقف · وصف≠وسم يشمل المتعلمين</text>
<rect x="330" y="430" width="540" height="70" rx="14" fill="#123a5c" stroke="#f2b134" stroke-width="4"/><text x="600" y="460" fill="#e8f1f8" font-size="24">🫁 أسبوع التنفس 17</text><text x="600" y="488" font-size="18">مراجعة 4 ملفات + مختبر اختياري (L1–L8) + راحة بلا ذنب — «هل الشعلة ولعة؟»</text>
<rect x="330" y="540" width="540" height="58" rx="12" fill="#0f2740" stroke="#39c0ba" stroke-width="2"/><text x="600" y="576">المرحلة ٢: التاريخ (18–25) — بطاقة الخبر تصير بطاقة الراوي، وبطاقة الرقم تصير بطاقة الرواية</text>
