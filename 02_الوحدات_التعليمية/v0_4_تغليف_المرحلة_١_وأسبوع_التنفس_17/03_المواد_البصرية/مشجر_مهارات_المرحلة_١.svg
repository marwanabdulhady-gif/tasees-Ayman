<rect x="620" y="90" width="255" height="86" rx="14" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/><text x="747" y="124" fill="#e8f1f8">و٣ اللغة (9–12)</text><text x="747" y="154" fill="#bcd6e6" font-size="18">درجات · جذور · وظائف · مشروع</text>
