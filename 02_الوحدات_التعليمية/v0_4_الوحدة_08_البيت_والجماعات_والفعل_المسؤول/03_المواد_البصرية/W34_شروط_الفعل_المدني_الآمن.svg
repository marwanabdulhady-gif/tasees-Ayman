<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'IBM Plex Sans Arabic','Noto Sans Arabic',Tahoma,sans-serif" direction="rtl">
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
<path d="M 24 0 L 0 0 0 24" fill="none" stroke="#D7DDE8" stroke-width="0.5"/></pattern>
<marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2E7D57"/></marker>
<marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C23B30"/></marker>
</defs>
<rect width="1200" height="675" fill="#F7F8F3"/>
<rect width="1200" height="675" fill="url(#grid)"/>
<text x="600" y="52" text-anchor="middle" font-family="'Aref Ruqaa','Amiri',serif" font-size="34" fill="#19213A">الفعل المسؤول الآمن — الشروط الستة والميدان</text>
<text x="600" y="82" text-anchor="middle" font-size="17" fill="#4A5470">الأسبوع ٣٤ — «ما العمل وكيف الخلاص؟» (Q70) · مهارة ٣٤: بطاقة الفعل المدني الآمن</text>
<rect x="610" y="100" width="550" height="72" rx="6" fill="#FFFFFF" stroke="#C23B30" stroke-width="2"/>
<text x="885" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#C23B30">الحفرة الأولى: الشلل</text>
<text x="885" y="150" text-anchor="middle" font-size="13" fill="#4A5470">تحليل ما بيخلصش — والاستعداد اللي ما بينتهيش بقرار</text>
<text x="885" y="166" text-anchor="middle" font-size="13" fill="#4A5470">بقى تسويفًا بلباس منهجي</text>
<rect x="40" y="100" width="550" height="72" rx="6" fill="#FFFFFF" stroke="#C23B30" stroke-width="2"/>
<text x="315" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#C23B30">الحفرة التانية: التهور</text>
<text x="315" y="150" text-anchor="middle" font-size="13" fill="#4A5470">صدق + حماس + غياب منهج = كارثة (اختبار الخوارج — و٢١)</text>
<text x="315" y="166" text-anchor="middle" font-size="13" fill="#4A5470">الحماس من غير عدة بيهدم اللي بيحاول يبنيه</text>
<line x1="885" y1="176" x2="700" y2="200" stroke="#2E7D57" stroke-width="2" marker-end="url(#arr)"/>
<line x1="315" y1="176" x2="500" y2="200" stroke="#2E7D57" stroke-width="2" marker-end="url(#arr)"/>
<rect x="430" y="188" width="340" height="44" rx="6" fill="#FFFFFF" stroke="#2E7D57" stroke-width="2.5"/>
<text x="600" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#2E7D57">الطريق الثالث: فعل مسؤول — يبدأ صغيرًا ومحميًّا بشروط</text>
<rect x="800" y="248" width="360" height="72" rx="6" fill="#FFFFFF" stroke="#2E7D57" stroke-width="1.5"/>
<rect x="1126" y="264" width="14" height="14" rx="3" fill="none" stroke="#2E7D57" stroke-width="1.5"/>
<text x="972" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#19213A">١ القانون أولًا</text>
<text x="972" y="300" text-anchor="middle" font-size="12" fill="#4A5470">في النور وبالمؤسسات — حماية الناس قبل المشروع</text>
<rect x="420" y="248" width="360" height="72" rx="6" fill="#FFFFFF" stroke="#2E7D57" stroke-width="1.5"/>
<rect x="746" y="264" width="14" height="14" rx="3" fill="none" stroke="#2E7D57" stroke-width="1.5"/>
<text x="592" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#19213A">٢ اللاعنف</text>
<text x="592" y="300" text-anchor="middle" font-size="12" fill="#4A5470">العنف بيهدم اللي بيقول إنه بيحميه — درس كل الفتن (و٢٢)</text>
<rect x="40" y="248" width="360" height="72" rx="6" fill="#FFFFFF" stroke="#2E7D57" stroke-width="1.5"/>
<rect x="366" y="264" width="14" height="14" rx="3" fill="none" stroke="#2E7D57" stroke-width="1.5"/>
<text x="212" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#19213A">٣ بلا حزبية ولا تكفير</text>
<text x="212" y="300" text-anchor="middle" font-size="12" fill="#4A5470">فعلك «علشان» حاجة — مش «ضد» ناس</text>
<rect x="800" y="332" width="360" height="72" rx="6" fill="#FFFFFF" stroke="#2E7D57" stroke-width="1.5"/>
<rect x="1126" y="348" width="14" height="14" rx="3" fill="none" stroke="#2E7D57" stroke-width="1.5"/>
<text x="972" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#19213A">٤ صغير ومقاس ومنتظم</text>
<text x="972" y="384" text-anchor="middle" font-size="12" fill="#4A5470">سلسلة و٣٣ كاملة — بحجم قدرتك مش بحجم حماسك</text>
<rect x="420" y="332" width="360" height="72" rx="6" fill="#FFFFFF" stroke="#2E7D57" stroke-width="1.5"/>
<rect x="746" y="348" width="14" height="14" rx="3" fill="none" stroke="#2E7D57" stroke-width="1.5"/>
<text x="592" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#19213A">٥ بروتوكول الحوار في المجال العام</text>
<text x="592" y="384" text-anchor="middle" font-size="12" fill="#4A5470">قول الدعوى · رجل الفولاذ · اذكر حدك · اقفل بتعلم لا بانتصار (و١)</text>
<rect x="40" y="332" width="360" height="72" rx="6" fill="#FFFFFF" stroke="#2E7D57" stroke-width="1.5"/>
<rect x="366" y="348" width="14" height="14" rx="3" fill="none" stroke="#2E7D57" stroke-width="1.5"/>
<text x="212" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#19213A">٦ الأمان — ليك ولغيرك</text>
<text x="212" y="384" text-anchor="middle" font-size="12" fill="#4A5470">خصوصية · حماية الأهل والدائرة · خروج بكرامة</text>
<text x="600" y="432" text-anchor="middle" font-size="13" fill="#20242C">الحماس وتر — والشروط قوس: مع بعض بيوصلوا السهم · الشروط مش قيودًا على الحماس — دي الهيكل اللي بيخليه يعمر بدل ما ينفجر</text>
<rect x="40" y="446" width="210" height="70" rx="6" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="1.5"/>
<text x="145" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#8A5A2B">خدمة معرفة</text>
<text x="145" y="494" text-anchor="middle" font-size="12" fill="#4A5470">محتوى عربي جيد — الدورة دي نفسها</text>
<rect x="272" y="446" width="210" height="70" rx="6" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="1.5"/>
<text x="377" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#8A5A2B">خدمة حي</text>
<text x="377" y="494" text-anchor="middle" font-size="12" fill="#4A5470">درس · نظافة · وساطة إصلاح بميزان</text>
<rect x="504" y="446" width="210" height="70" rx="6" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="1.5"/>
<text x="609" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#8A5A2B">وقفية صغيرة</text>
<text x="609" y="494" text-anchor="middle" font-size="12" fill="#4A5470">حاجة تستمر بعدك: كتاب · أداة · موقع</text>
<rect x="736" y="446" width="210" height="70" rx="6" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="1.5"/>
<text x="841" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#8A5A2B">مهنة كخدمة</text>
<text x="841" y="494" text-anchor="middle" font-size="12" fill="#4A5470">إتقان شغلك + تدريب حد أصغر منك</text>
<rect x="968" y="446" width="210" height="70" rx="6" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="1.5"/>
<text x="1073" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#8A5A2B">توثيق ذاكرة</text>
<text x="1073" y="494" text-anchor="middle" font-size="12" fill="#4A5470">عيلتك · حيك · حرفتك — قبل ما تضيع</text>
<rect x="40" y="530" width="1120" height="52" rx="6" fill="#FFFFFF" stroke="#2E7D57" stroke-width="2"/>
<text x="600" y="551" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D57">ميزان الدورة: ٣٤ مهارة · ٢٠ مسمارًا · ٨ ملفات — من «إنت مش عارف إنك مش عارف» (و١) للميدان (و٣٤)</text>
<text x="600" y="573" text-anchor="middle" font-size="13" fill="#4A5470">رأس المال مش المعلومات — العدة والأدب: بلا نكات على مقدسات · بلا تجسيد · بلا طائفية · و«لا أعلم بعد» صنعة مش نقص</text>
<rect x="40" y="594" width="1120" height="34" rx="6" fill="#FFFFFF" stroke="#4A5470" stroke-width="1"/>
<text x="600" y="616" text-anchor="middle" font-size="13" fill="#20242C">ملف و٨ — خمس مكونات: خريطة بيت · خطة دائرة · بطاقة فكرة لسلوك · بطاقة فعل مدني آمن · ميزان الدورة + سطر «لسه ما أعرفوش»</text>
<text x="600" y="646" text-anchor="middle" font-size="13" fill="#20242C">المصادر: Q68 بماذا ستساهم · Q69–Q70 الـ٦٠٠ سؤال و«ما العمل» · بروتوكولات و١ · اختبار الخوارج (و٢١) · كربلاء (و٢٢) · AT إثراء</text>
<text x="600" y="666" text-anchor="middle" font-size="12" fill="#4A5470">مشروع تأسيس · الوحدة الثامنة v0.4 · هوية v1 · ٢٦ أكتوبر ٢٠٢٦ — أسلوب مستوحى، ليس قولًا منسوبًا</text>
</svg>
