<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Cairo, sans-serif">
<rect width="1200" height="675" fill="#0e1b2e"/>
<text x="600" y="58" fill="#e8f1f8" font-size="34" text-anchor="middle" font-weight="bold">بطاقة الرواية الخماسية: جهاز فحص الخبر التاريخي</text>
<g font-size="21" text-anchor="middle" fill="#e8f1f8">
<rect x="60" y="96" width="200" height="96" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/>
<text x="160" y="134" fill="#e8f1f8" font-size="22" text-anchor="middle" >١ الراوي</text>
<text x="160" y="166" fill="#bcd6e6" font-size="16" text-anchor="middle" >مين أول من حكى؟ ثقة عند مين؟</text>
<rect x="280" y="96" width="200" height="96" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/>
<text x="380" y="134" fill="#e8f1f8" font-size="22" text-anchor="middle" >٢ السلسلة</text>
<text x="380" y="166" fill="#bcd6e6" font-size="16" text-anchor="middle" >كام واسطة لحد المؤلف؟</text>
<rect x="500" y="96" width="200" height="96" rx="12" fill="#123a5c" stroke="#f2b134" stroke-width="3"/>
<text x="600" y="134" fill="#e8f1f8" font-size="22" text-anchor="middle" >٣ المتن</text>
<text x="600" y="166" fill="#bcd6e6" font-size="16" text-anchor="middle" >معقول؟ مبالغة؟ تناقض؟</text>
<rect x="720" y="96" width="200" height="96" rx="12" fill="#123a5c" stroke="#f2b134" stroke-width="3"/>
<text x="820" y="134" fill="#e8f1f8" font-size="22" text-anchor="middle" >٤ السياق والمصلحة</text>
<text x="820" y="166" fill="#bcd6e6" font-size="16" text-anchor="middle" >لصالح مين الحكاية بتشتغل؟</text>
<rect x="940" y="96" width="200" height="96" rx="12" fill="#123a5c" stroke="#e05252" stroke-width="3"/>
<text x="1040" y="134" fill="#e8f1f8" font-size="22" text-anchor="middle" >٥ الأثر</text>
<text x="1040" y="166" fill="#bcd6e6" font-size="16" text-anchor="middle" >على قد الأثر تكون الصرامة</text>
</g>
<g font-size="22" fill="#bcd6e6" text-anchor="middle">
<rect x="100" y="224" width="1000" height="56" rx="12" fill="#0f2740" stroke="#0f2740" stroke-width="0"/>
<text x="600" y="260" fill="#e8f1f8" font-size="21" text-anchor="middle" >علامة حمراء تلقائية: التعميم المجهول — «قالوا» «رُوي أن» «الناس بتقول» — أنهي مؤرخين؟ فين أسماؤهم؟</text>
<rect x="100" y="294" width="1000" height="56" rx="12" fill="#0f2740" stroke="#0f2740" stroke-width="0"/>
<text x="600" y="330" fill="#e8f1f8" font-size="21" text-anchor="middle" >الدرجة النهائية: قوي · ضعيف · لا أعلم بعد — والثالثة أمانة مش ضعفًا</text>
<rect x="100" y="364" width="1000" height="56" rx="12" fill="#0f2740" stroke="#0f2740" stroke-width="0"/>
<text x="600" y="400" fill="#e8f1f8" font-size="21" text-anchor="middle" >جهاز النقد الذاتي في تراثنا: الطبري «منه صحيح ومنها سقيم» · ابن الجوزي يصنف الموضوعات</text>
<rect x="100" y="434" width="1000" height="56" rx="12" fill="#0f2740" stroke="#0f2740" stroke-width="0"/>
<text x="600" y="470" fill="#e8f1f8" font-size="21" text-anchor="middle" >خندقان: تقديس العصر (بشر بلا أخطاء) · ازدراء العصر (الحاضرية) — والمنهج الوسط: نفهم بشروطهم</text>
<rect x="100" y="504" width="1000" height="56" rx="12" fill="#0f2740" stroke="#0f2740" stroke-width="0"/>
<text x="600" y="540" fill="#e8f1f8" font-size="21" text-anchor="middle" >القواعد الثلاث: نفحص الخبر لا العصر · نفهم الأشخاص بشروطهم · نسأل أسئلة الحاضر بأدب</text>
</g>
<text x="600" y="640" fill="#7fa3bb" font-size="20" text-anchor="middle">مشروع تأسيس — الوحدة 5 v0.4 — الأسبوع 18 — بلا تجسيد</text>
</svg>
