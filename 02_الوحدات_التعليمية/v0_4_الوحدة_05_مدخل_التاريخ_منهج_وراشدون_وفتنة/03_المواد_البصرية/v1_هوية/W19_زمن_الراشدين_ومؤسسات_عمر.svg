<rect x="70" y="466" width="1060" height="52" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="0"/>
<text x="600" y="498" fill="#4A5470" font-size="19" text-anchor="middle" >قصة ابن القبطي: «متى استعبدتم الناس وقد ولدتهم أمهاتهم أحرارًا؟» — محاسبة الولاة واقعة بأسمائها</text>
<rect x="70" y="530" width="1060" height="52" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="0"/>
<text x="600" y="562" fill="#4A5470" font-size="19" text-anchor="middle" >الفتح ≠ الاستعمار: الأرض · الدين · المال · شهادة المفتوحين — وسؤال الأحقية: وقائع/أفهام/ثمرة = الأدب</text>
<text x="600" y="640" fill="#4A5470" font-size="20" text-anchor="middle">مشروع تأسيس — الوحدة 5 v0.4 — الأسبوع 19 — بلا تجسيد · هوية v1</text>
