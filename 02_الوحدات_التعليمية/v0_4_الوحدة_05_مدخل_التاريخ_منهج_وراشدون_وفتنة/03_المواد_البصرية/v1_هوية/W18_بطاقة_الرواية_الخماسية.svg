<text x="600" y="470" fill="#19213A" font-size="21" text-anchor="middle" >خندقان: تقديس العصر (بشر بلا أخطاء) · ازدراء العصر (الحاضرية) — والمنهج الوسط: نفهم بشروطهم</text>
