<rect x="60" y="96" width="200" height="96" rx="6" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="3"/>
<text x="160" y="134" fill="#19213A" font-size="22" text-anchor="middle" >١ الراوي</text>
<text x="160" y="166" fill="#4A5470" font-size="16" text-anchor="middle" >مين أول من حكى؟ ثقة عند مين؟</text>
