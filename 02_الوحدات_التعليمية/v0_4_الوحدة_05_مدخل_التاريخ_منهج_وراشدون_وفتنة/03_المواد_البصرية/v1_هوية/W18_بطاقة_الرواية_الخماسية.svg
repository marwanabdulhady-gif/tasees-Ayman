<text x="600" y="260" fill="#19213A" font-size="21" text-anchor="middle" >علامة حمراء تلقائية: التعميم المجهول — «قالوا» «رُوي أن» «الناس بتقول» — أنهي مؤرخين؟ فين أسماؤهم؟</text>
