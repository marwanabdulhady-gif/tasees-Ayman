<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'IBM Plex Sans Arabic', 'Noto Sans Arabic', Tahoma, sans-serif"><defs><pattern id="v1grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" fill="none" stroke="#D7DDE8" stroke-width="0.7"/></pattern></defs>
<rect width="1200" height="675" fill="#F7F8F3"/><rect width="1200" height="675" fill="url(#v1grid)"/>
<text x="600" y="58" fill="#19213A" font-size="32" text-anchor="middle" font-weight="bold">خريطة الفتنة الكبرى وآدابها: ٣٥–٤١هـ — بلا تقديس ولا ازدراء</text>
<g font-size="19" text-anchor="middle" fill="#19213A">
<rect x="45" y="96" width="180" height="132" rx="6" fill="#FFFFFF" stroke="#20242C" stroke-width="3" stroke-dasharray="4 3"/>
<text x="135" y="124" fill="#4A5470" font-size="17" text-anchor="middle" >٣٥هـ</text>
<text x="135" y="150" fill="#19213A" font-size="19" text-anchor="middle" >بيعة علي</text>
<text x="135" y="174" fill="#4A5470" font-size="13" text-anchor="middle" >«دعوني والتمسوا غيري»</text>
<text x="135" y="194" fill="#4A5470" font-size="13" text-anchor="middle" >خلاف على الترتيب:</text>
<text x="135" y="214" fill="#4A5470" font-size="13" text-anchor="middle" >قصاص مقابل استقرار</text>
<text x="229" y="166" fill="#4A5470" font-size="24">←</text>
<rect x="238" y="96" width="180" height="132" rx="6" fill="#FFFFFF" stroke="#C23B30" stroke-width="3"/>
<text x="328" y="124" fill="#4A5470" font-size="17" text-anchor="middle" >٣٦هـ</text>
<text x="328" y="150" fill="#19213A" font-size="19" text-anchor="middle" >الجمل</text>
<text x="328" y="174" fill="#4A5470" font-size="13" text-anchor="middle" >صلح كاد ينجح</text>
<text x="328" y="194" fill="#4A5470" font-size="13" text-anchor="middle" >إشعال من أطراف</text>
<text x="328" y="214" fill="#4A5470" font-size="13" text-anchor="middle" >علي بكى على طلحة والزبير</text>
<text x="422" y="166" fill="#4A5470" font-size="24">←</text>
<rect x="431" y="96" width="180" height="132" rx="6" fill="#FFFFFF" stroke="#C23B30" stroke-width="3"/>
<text x="521" y="124" fill="#4A5470" font-size="17" text-anchor="middle" >٣٧هـ</text>
<text x="521" y="150" fill="#19213A" font-size="19" text-anchor="middle" >صفين</text>
<text x="521" y="174" fill="#4A5470" font-size="13" text-anchor="middle" >رفع المصاحف:</text>
<text x="521" y="194" fill="#4A5470" font-size="13" text-anchor="middle" >«كلمة حق</text>
<text x="521" y="214" fill="#4A5470" font-size="13" text-anchor="middle" >يراد بها باطل»</text>
<text x="615" y="166" fill="#4A5470" font-size="24">←</text>
<rect x="624" y="96" width="180" height="132" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="3"/>
<text x="714" y="124" fill="#4A5470" font-size="17" text-anchor="middle" >التحكيم</text>
<text x="714" y="150" fill="#19213A" font-size="19" text-anchor="middle" >مشهور ≠ مقطوع</text>
<text x="714" y="174" fill="#4A5470" font-size="13" text-anchor="middle" >حكاية الخداع منتشرة</text>
<text x="714" y="194" fill="#4A5470" font-size="13" text-anchor="middle" >كبار المحققين</text>
<text x="714" y="214" fill="#4A5470" font-size="13" text-anchor="middle" >بيضعفون سندها</text>
<text x="808" y="166" fill="#4A5470" font-size="24">←</text>
<rect x="817" y="96" width="180" height="132" rx="6" fill="#FFFFFF" stroke="#C23B30" stroke-width="3"/>
<text x="907" y="124" fill="#4A5470" font-size="17" text-anchor="middle" >٣٨–٤٠هـ</text>
<text x="907" y="150" fill="#19213A" font-size="19" text-anchor="middle" >الخوارج</text>
<text x="907" y="174" fill="#4A5470" font-size="13" text-anchor="middle" >عباد — لكن: تكفير</text>
<text x="907" y="194" fill="#4A5470" font-size="13" text-anchor="middle" >بالكبيرة · واستحلال</text>
<text x="907" y="214" fill="#4A5470" font-size="13" text-anchor="middle" >مقتل علي ٤٠هـ</text>
<text x="1001" y="166" fill="#4A5470" font-size="24">←</text>
<rect x="1010" y="96" width="180" height="132" rx="6" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="3"/>
<text x="1100" y="124" fill="#4A5470" font-size="17" text-anchor="middle" >٤١هـ</text>
<text x="1100" y="150" fill="#19213A" font-size="19" text-anchor="middle" >عام الجماعة</text>
<text x="1100" y="174" fill="#4A5470" font-size="13" text-anchor="middle" >صلح الحسن:</text>
<text x="1100" y="194" fill="#4A5470" font-size="13" text-anchor="middle" >«لعل الله أن يصلح به</text>
<text x="1100" y="214" fill="#4A5470" font-size="13" text-anchor="middle" >بين فئتين» — الصلح سيادة</text>
</g>
<text x="600" y="268" fill="#19213A" font-size="21" text-anchor="middle" font-weight="bold">بطاقة الخوارج — أربع صفات عابرة للعصور (تُختبر على أفكار وسلوك — بلا تسمية جماعات)</text>
<g font-size="20" text-anchor="middle" fill="#19213A">
<rect x="70" y="292" width="250" height="76" rx="6" fill="#FFFFFF" stroke="#C23B30" stroke-width="3"/>
<text x="195" y="324" fill="#19213A" font-size="19" text-anchor="middle" >١ تكفير بالكبيرة</text>
<text x="195" y="350" fill="#4A5470" font-size="15" text-anchor="middle" >الغلط بقى كفرًا</text>
<rect x="340" y="292" width="250" height="76" rx="6" fill="#FFFFFF" stroke="#C23B30" stroke-width="3"/>
<text x="465" y="324" fill="#19213A" font-size="19" text-anchor="middle" >٢ استحلال بالتأويل</text>
<text x="465" y="350" fill="#4A5470" font-size="15" text-anchor="middle" >التأويل بقى رخصة دم</text>
<rect x="610" y="292" width="250" height="76" rx="6" fill="#FFFFFF" stroke="#C23B30" stroke-width="3"/>
<text x="735" y="324" fill="#19213A" font-size="19" text-anchor="middle" >٣ يقين قاطع</text>
<text x="735" y="350" fill="#4A5470" font-size="15" text-anchor="middle" >اختفى «يمكن أكون غلطان»</text>
<rect x="880" y="292" width="250" height="76" rx="6" fill="#FFFFFF" stroke="#C23B30" stroke-width="3"/>
<text x="1005" y="324" fill="#19213A" font-size="19" text-anchor="middle" >٤ شيطنة الخصم</text>
<text x="1005" y="350" fill="#4A5470" font-size="15" text-anchor="middle" >مخطئ بقى «عدو الحقيقة»</text>
</g>
<g font-size="20" fill="#4A5470" text-anchor="middle">
<rect x="80" y="400" width="1040" height="56" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="0"/>
<text x="600" y="436" fill="#19213A" font-size="20" text-anchor="middle" >الدروس الأربعة: الدم أولًا — الدم دايمًا · الإشاعة تقتل أكثر من السيف · الخوارج فكرة متكررة · الصلح سيادة مش هزيمة</text>
<rect x="80" y="470" width="1040" height="56" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="0"/>
<text x="600" y="506" fill="#19213A" font-size="20" text-anchor="middle" >وصية علي القانونية: «دمي قصاصًا لا فوضى — القصاص حقي وحق ورثتي، مش حق الغوغاء»</text>
<rect x="80" y="540" width="1040" height="56" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="0"/>
<text x="600" y="576" fill="#19213A" font-size="20" text-anchor="middle" >سؤال القفلة: أين يمكن أن تكون أنت الحسن؟ — في أي خلاف إنت فيه النهارده</text>
</g>
<text x="600" y="640" fill="#4A5470" font-size="20" text-anchor="middle">مشروع تأسيس — الوحدة 5 v0.4 — الأسبوع 21 — بلا تجسيد · هوية v1</text>
</svg>
