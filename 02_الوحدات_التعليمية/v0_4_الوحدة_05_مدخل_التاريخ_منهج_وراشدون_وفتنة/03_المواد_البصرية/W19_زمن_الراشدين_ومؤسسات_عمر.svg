<text x="615" y="322" fill="#bcd6e6" font-size="15" text-anchor="middle" >قرار هوية في ثوب إداري</text>
<rect x="810" y="264" width="350" height="78" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/>
<text x="985" y="296" fill="#e8f1f8" font-size="20" text-anchor="middle" >القضاء المستقل</text>
<text x="985" y="322" fill="#bcd6e6" font-size="15" text-anchor="middle" >فصل سلطات قبل مونتسكيو بألف ومية سنة</text>
<rect x="70" y="356" width="350" height="78" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/>
<text x="245" y="388" fill="#e8f1f8" font-size="20" text-anchor="middle" >الحسبة والسوق</text>
<text x="245" y="414" fill="#bcd6e6" font-size="15" text-anchor="middle" >حماية اقتصادية للعامة</text>
<rect x="440" y="356" width="350" height="78" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/>
<text x="615" y="388" fill="#e8f1f8" font-size="20" text-anchor="middle" >محاسبة الولاة</text>
<text x="615" y="414" fill="#bcd6e6" font-size="15" text-anchor="middle" >حصر الثروة قبل وبعد — «من أين لك هذا؟»</text>
<rect x="810" y="356" width="350" height="78" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/>
<text x="985" y="388" fill="#e8f1f8" font-size="20" text-anchor="middle" >بيت المال والرعاية</text>
<text x="985" y="414" fill="#bcd6e6" font-size="15" text-anchor="middle" >رعاية اجتماعية حتى لغير المسلمين</text>
</g>
<rect x="70" y="466" width="1060" height="52" rx="12" fill="#0f2740" stroke="#0f2740" stroke-width="0"/>
<text x="600" y="498" fill="#bcd6e6" font-size="19" text-anchor="middle" >قصة ابن القبطي: «متى استعبدتم الناس وقد ولدتهم أمهاتهم أحرارًا؟» — محاسبة الولاة واقعة بأسمائها</text>
<rect x="70" y="530" width="1060" height="52" rx="12" fill="#0f2740" stroke="#0f2740" stroke-width="0"/>
<text x="600" y="562" fill="#bcd6e6" font-size="19" text-anchor="middle" >الفتح ≠ الاستعمار: الأرض · الدين · المال · شهادة المفتوحين — وسؤال الأحقية: وقائع/أفهام/ثمرة = الأدب</text>
<text x="600" y="640" fill="#7fa3bb" font-size="20" text-anchor="middle">مشروع تأسيس — الوحدة 5 v0.4 — الأسبوع 19 — بلا تجسيد</text>
</svg>
