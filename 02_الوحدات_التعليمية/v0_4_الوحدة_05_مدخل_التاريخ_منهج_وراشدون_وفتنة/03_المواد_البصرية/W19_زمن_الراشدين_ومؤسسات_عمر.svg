<text x="465" y="182" fill="#bcd6e6" font-size="13" text-anchor="middle" >الفتوح + المؤسسات الست ·</text>
<text x="465" y="200" fill="#bcd6e6" font-size="13" text-anchor="middle" > «من أين لك هذا؟»</text>
<rect x="610" y="96" width="250" height="104" rx="12" fill="#123a5c" stroke="#f2b134" stroke-width="3"/>
<text x="735" y="128" fill="#e8f1f8" font-size="24" text-anchor="middle" >عثمان</text>
<text x="735" y="156" fill="#bcd6e6" font-size="17" text-anchor="middle" >٢٣–٣٥هـ</text>
<text x="735" y="182" fill="#bcd6e6" font-size="13" text-anchor="middle" >أقصى اتساع · الأسطول · ا</text>
<text x="735" y="200" fill="#bcd6e6" font-size="13" text-anchor="middle" >لمصحف الإمام</text>
<rect x="880" y="96" width="250" height="104" rx="12" fill="#123a5c" stroke="#e05252" stroke-width="3"/>
<text x="1005" y="128" fill="#e8f1f8" font-size="24" text-anchor="middle" >علي</text>
<text x="1005" y="156" fill="#bcd6e6" font-size="17" text-anchor="middle" >٣٥–٤٠هـ</text>
<text x="1005" y="182" fill="#bcd6e6" font-size="13" text-anchor="middle" >الفتنة الكبرى · التحكيم </text>
<text x="1005" y="200" fill="#bcd6e6" font-size="13" text-anchor="middle" >· مقتله ٤٠هـ</text>
</g>
<text x="600" y="244" fill="#e8f1f8" font-size="22" text-anchor="middle" font-weight="bold">مؤسسات عمر — كل بند «أول مرة في تاريخ المنطقة»</text>
<g font-size="20" text-anchor="middle" fill="#e8f1f8">
<rect x="70" y="264" width="350" height="78" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/>
<text x="245" y="296" fill="#e8f1f8" font-size="20" text-anchor="middle" >الدواوين</text>
<text x="245" y="322" fill="#bcd6e6" font-size="15" text-anchor="middle" >مرتبات بجداول — دولة إدارة لا بيت شيخ</text>
<rect x="440" y="264" width="350" height="78" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/>
