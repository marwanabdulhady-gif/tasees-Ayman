<text x="195" y="156" fill="#bcd6e6" font-size="17" text-anchor="middle" >١١–١٣هـ</text>
<text x="195" y="182" fill="#bcd6e6" font-size="13" text-anchor="middle" >السقيفة: شورى+بيعة · الر</text>
