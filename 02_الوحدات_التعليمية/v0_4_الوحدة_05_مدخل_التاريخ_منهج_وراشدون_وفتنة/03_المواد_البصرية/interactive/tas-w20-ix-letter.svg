<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img"
     aria-label="رسالة متخيَّلة منسوبة لوليٍّ، فيها أربع علامات تزوير قابلة للنقر">
<title>الرسالة المتخيَّلة — أربع علامات تزوير (الأسبوع ٢٠)</title>
<style>
  text{font-family:'IBM Plex Sans Arabic','Noto Sans Arabic',Tahoma,sans-serif}
  .body{fill:#20242C;font-size:13px}
  .lbl{fill:#4A5470;font-size:11.5px}
  .cap{fill:#4A5470;font-size:11.5px}
  .seal{fill:#C23B30;font-size:11px}
  .ink{fill:none;stroke:#19213A;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .rule{fill:none;stroke:#D7DDE8;stroke-width:1.3;stroke-linecap:round}
  .hs{fill:none;cursor:pointer}
  .hs:hover,.hs:focus-visible{fill:#C23B30;fill-opacity:.08;stroke:#C23B30;stroke-width:1.4}
</style>
<rect x="0" y="0" width="640" height="420" fill="#F7F8F3"/>
<rect x="44" y="24" width="552" height="342" rx="6" fill="#FFFFFF" stroke="#2440A0" stroke-width="1.6"/>
<text class="body" x="572" y="62" text-anchor="end">بسم الله الرحمن الرحيم</text>
<line class="rule" x1="64" y1="80" x2="576" y2="80"/>
<text class="body" x="572" y="112" text-anchor="end">ذُكر أن أهل الأمصار قد بايعوا، وقالوا إن الأمر قد انتهى.</text>
<text class="body" x="572" y="144" text-anchor="end">وقد رُوي عن غير واحد أن المدينة قد خلت من أهلها.</text>
<text class="body" x="572" y="176" text-anchor="end">والناس كلهم على ذلك، لا خلاف بينهم.</text>
<line class="rule" x1="64" y1="196" x2="576" y2="196"/>
<text class="lbl" x="572" y="222" text-anchor="end">ولا يعرف أحد من كتب هذا الكتاب، ولا من حمله إلينا.</text>
<rect x="120" y="252" width="88" height="88" rx="44" fill="none" stroke="#C23B30" stroke-width="1.6" stroke-dasharray="5 4"/>
<text class="seal" x="164" y="300" text-anchor="middle">ختم</text>
<path class="ink" d="M404,252 l48,-20 v30 h-48 z" fill="none"/>
<text class="lbl" x="500" y="264" text-anchor="end">هوامش لاحقة بخط تاني</text>
<path class="ink" d="M498,272 q-24,24 -36,44"/>
<text class="lbl" x="572" y="330" text-anchor="end">والرسالة دي بتقول لنا: لازم نتحرك فورًا ونسيب البيت.</text>
<path d="M52,246 q12,10 0,20" fill="none" stroke="#C23B30" stroke-width="1.6" stroke-linecap="round"/>
<text class="cap" x="320" y="394" text-anchor="middle">رسالة منسوبة لوليٍّ — افحصها بالبطاقة قبل ما تتحرك</text>
<rect class="hs" data-i="1" x="52" y="96" width="528" height="86" tabindex="0"/>
<rect class="hs" data-i="2" x="52" y="200" width="528" height="38" tabindex="0"/>
<rect class="hs" data-i="3" x="116" y="248" width="96" height="96" tabindex="0"/>
<rect class="hs" data-i="4" x="404" y="284" width="172" height="52" tabindex="0"/>
</svg>
