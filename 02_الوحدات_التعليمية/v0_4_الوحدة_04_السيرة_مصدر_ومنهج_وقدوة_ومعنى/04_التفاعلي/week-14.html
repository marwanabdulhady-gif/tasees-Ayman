        "q": "موقف في حياتك حسّيت فيه إنك في «الطائف» — أبواب مقفولة بعد مجهود طويل: اكتب الموقف، واكتب: إيه اللي استنفدته فعلًا من الأسباب؟ وإيه الأداة اللي لسه ما جربتهاش؟",
        "key": "journal"
      }
    },
    {
      "id": "w14-12",
      "layout": "L7",
      "heading": "نلمّ الليلة في تلات سطور",
      "lines": [
        "البداية بذرة وحاضنة: «اقرأ» ثم بيت ثم دار الأرقم — والبدايات الكبيرة صغيرة ومركزة.",
        "الأزمات أدوات: الحبشة أرض بديلة، والطائف استنفاد أسباب، والشعب صمود يكشف الناس.",
        "العقبة والتدرج: أخلاق قبل دولة، وفرد قبل جماعة، وسفير واحد فتح مدينة."
      ],
      "replay": "في الأول خمّنت «{{predict}}» — والنص قال إن أول ما نزل أمر بالقراءة، مش بالقتال ولا بالهجرة.",
      "task": {
        "مستكشف": "خريطة المحطات بالترتيب بلا تواريخ.",
        "ممارس": "الخريطة + محطة واحدة بتتكلم مع وضعك + ليه.",
        "متقدم": "الخريطة + قرار المحطة الجاية + إجابة صريحة عن الأداة اللي لسه ما جربتهاش."
      }
    }
  ]
}

<script src="../../../07_الهوية_البصرية_والتفاعل/templates/tasees-runtime.js" onerror="this.remove()"></script>
<script>
(function () {
  "use strict";
  var W = JSON.parse(document.getElementById("week").textContent);
  var T = window.Tasees, AR = T.AR, el = T.el, store = T.store;
  var TRACKS = ["مستكشف", "ممارس", "متقدم"];
  var track = store.get("track") || "ممارس";
  var visible = function () { return W.screens.filter(function (s) { return !s.track || s.track === track; }); };
  var i = 0;

  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function sanad(list) { return (list || []).map(function (s) { var tc = /^≈|\d:\d/.test(s[1]); return '<span class="t-sanad"><b>' + esc(s[0]) + "</b>" + (tc ? '<span class="tc">' + esc(s[1]) + "</span>" : esc(s[1])) + "</span>"; }).join(""); }
  function bricks(n) { var h = '<div class="wall" aria-label="طوب الوحدة">'; for (var k = 1; k <= 4; k++) { h += '<span class="t-brick' + (store.get("done") && k === ((W.week - 1) % 4) + 1 ? " is-laid" + (n ? " is-new" : "") : "") + '"></span>'; } return h + "</div>"; }

  var LAYOUT = {
    L1: function (s) {
      return '<p class="t-eyebrow">' + esc(W.eyebrow) + '</p><h1 class="t-title">' + esc(W.title) + '</h1><svg class="t-underline" viewBox="0 0 320 12" aria-hidden="true"><path d="M4 8 C60 2 120 11 180 6 S280 3 316 7"/></svg>' +
        '<p class="t-small" style="margin:0">' + esc(W.subtitle) + '</p><div class="q-box"><small>سؤال الأسبوع</small>' + esc(W.question) + "</div>" +
        '<div class="row" role="group" aria-label="المسار"><span class="t-small">مسارك:</span>' + TRACKS.map(function (t) { return '<button class="t-chip js-track" type="button" aria-pressed="' + (t === track) + '">' + t + "</button>"; }).join("") + "</div>" +
        '<div class="audio">' + esc(W.audio) + '</div><p class="t-small" style="margin:0">نصوص مستوحاة من أسلوب المهندس أيمن عبد الرحيم في الشرح، كُتبت لأغراض تدريبية داخل مشروع تأسيس، وليست قولًا منسوبًا إليه.</p>';
    },
    L2: function (s) {
      var art = s.art_src ? '<img src="' + esc(s.art_src) + '" alt="">' : "رسم الخطاف <code>" + esc(s.art) + "</code> لم يُولَّد بعد";
      return '<div class="hook-art">' + art + '</div><p class="t-voice">' + esc(s.voice) + '</p><p class="t-sharh">' + esc(s.sharh) + "</p>";
    },
    L3: function (s) {
      return '<h2 class="t-h2">' + esc(s.heading) + '</h2><p class="t-matn">' + esc(s.matn) + '</p><p class="t-sharh">' + esc(s.sharh) + "</p>" +
        (s.trap ? '<p class="t-feedback t-feedback--bad"><strong>' + esc(s.trap.title) + "</strong>" + esc(s.trap.text) + "</p>" : "");
    },
    L4: function (s) { return '<h2 class="t-h2">' + esc(s.heading) + "</h2>" + (s.instruction ? '<p class="t-small" style="margin:0">' + esc(s.instruction) + "</p>" : "") + '<div class="demo" data-mount></div>'; },
    L5: function (s) { return (s.classic ? '<p class="t-classic" style="margin:0">' + esc(s.classic) + "</p>" : "") + '<p class="t-matn">' + esc(s.matn) + '</p><div class="demo" data-mount></div>'; },
    L6: function (s) { return '<div class="demo" data-mount></div>'; },
    L7: function (s) {
      var p = store.get("predict");
      return '<h2 class="t-title" style="font-size:2.2rem">' + esc(s.heading) + '</h2><ol class="lines">' + s.lines.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ol>" +
        (p ? '<p class="t-feedback">' + esc(s.replay).replace("{{predict}}", "<strong style=\"display:inline\">«" + esc(p) + "»</strong>") + "</p>" : "") +
        '<p class="t-feedback t-feedback--ok"><strong>مهمة الأسبوع · ' + esc(track) + "</strong>" + esc(s.task[track]) + '</p><p class="t-small" style="margin:0">' + esc(W.next) + "</p>";
    }
  };

  function show() {
    var list = visible(); i = Math.max(0, Math.min(i, list.length - 1));
    var s = list[i], last = s.layout === "L7";
    if (last && !store.get("done")) { store.set("done", "1"); s._new = true; }
    var stage = document.getElementById("stage");
    stage.innerHTML = '<section class="t-screen" data-id="' + esc(s.id) + '" data-layout="' + s.layout + '"><aside class="t-margin">' + sanad(s.sanad) + (s.layout === "L1" || last ? bricks(last && s._new) : "") + '</aside><div class="t-main">' + LAYOUT[s.layout](s) + "</div></section>";
    var mount = stage.querySelector("[data-mount]"); if (mount && s.pattern) T.render(mount, s.pattern, s.data);
    stage.querySelectorAll(".js-track").forEach(function (b) { b.onclick = function () { track = b.textContent; store.set("track", track); show(); }; });
    document.getElementById("wk-name").innerHTML = 'تأسيس <span style="font-family:var(--f-body);font-size:1rem;font-weight:500">· الأسبوع ' + AR(W.week) + "</span>";
    document.getElementById("wk-pos").textContent = "الشاشة " + AR(i + 1) + " من " + AR(list.length);
    document.getElementById("pencil").innerHTML = list.map(function (_, k) { return '<i class="' + (k <= i ? "on" : "") + '"></i>'; }).join("");
    document.getElementById("prev").disabled = i === 0;
    document.getElementById("next").textContent = last ? "تم" : i === 0 ? "يلا بينا" : "التالي";
    document.getElementById("next").disabled = last;
  }
  document.getElementById("prev").onclick = function () { i--; show(); window.scrollTo(0, 0); };
  document.getElementById("next").onclick = function () { i++; show(); window.scrollTo(0, 0); };
  document.addEventListener("keydown", function (e) { if (e.target.closest("input,textarea,select")) return; if (e.key === "ArrowLeft") { i++; show(); } if (e.key === "ArrowRight") { i--; show(); } });
  show();
})();
</script>
