<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Cairo, sans-serif">
<rect width="1200" height="675" fill="#0e1b2e"/>
<text x="600" y="58" fill="#e8f1f8" font-size="36" text-anchor="middle" font-weight="bold">السيرة مش غزوات وبس: الحجم الحقيقي والمعنى</text>
<g font-size="21" text-anchor="middle" fill="#e8f1f8">
<rect x="70" y="96" width="335" height="86" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/><text x="237" y="128">23 سنة دعوة</text><text x="237" y="158" fill="#bcd6e6" font-size="18">≈80 تحركًا · &lt;10 معارك فعلية</text>
<rect x="435" y="96" width="335" height="86" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/><text x="602" y="128">ضحايا بمئات لا بآلاف</text><text x="602" y="158" fill="#bcd6e6" font-size="18">بمعايير القرن السابع: الأقل دموية</text>
<rect x="800" y="96" width="330" height="86" rx="12" fill="#123a5c" stroke="#f2b134" stroke-width="3"/><text x="965" y="128">قواعد اشتباك سابقة</text><text x="965" y="158" fill="#bcd6e6" font-size="18">لا امرأة/طفل/راهب · لا شجر · لا مُثلة</text>
</g>
<g font-size="21" fill="#bcd6e6" text-anchor="middle">
<rect x="120" y="212" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="246">اليوم العادي: ليل قيام ← مجلس علم وقضاء ← عيادة وحوائج ← بيت «مهنة أهله» ← سوق ← وفود ورسائل</text>
<rect x="120" y="280" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="314">الانتشار: إندونيسيا وماليزيا وغرب إفريقيا — تجار ودعاة بلا جيوش · «لا إكراه في الدين»</text>
<rect x="120" y="348" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="382">وظيفة ١: معيار التفكير (و1) · وظيفة ٢: مدرسة التلقي (و2) — أصل سلسلة التلقي: الغار</text>
<rect x="120" y="416" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="450">وظيفة ٣: حياة اللغة (و3) — مختبرها نصوص الوحي · وظيفة ٤: المعنى — حياة موصولة</text>
<rect x="120" y="484" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="518">بشري فلا نستحيل · كامل فلا نرتخي — «إنما أنا بشر مثلكم يوحى إليّ»</text>
<rect x="120" y="552" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="586">ختام المرحلة ١: تفكير + خزانة + خريطة + لغة + سيرة ← أسبوع تنفس ← المرحلة ٢: التاريخ</text>
</g>
<text x="600" y="650" fill="#7fa3bb" font-size="18" text-anchor="middle">مشروع تأسيس — الوحدة 4 v0.4 — الأسبوع 16 — بلا تجسيد</text>
</svg>
