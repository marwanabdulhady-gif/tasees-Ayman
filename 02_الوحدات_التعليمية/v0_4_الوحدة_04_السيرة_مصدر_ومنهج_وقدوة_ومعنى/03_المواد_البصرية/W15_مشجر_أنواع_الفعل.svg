<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Cairo, sans-serif">
<rect width="1200" height="675" fill="#0e1b2e"/>
<text x="600" y="60" fill="#e8f1f8" font-size="36" text-anchor="middle" font-weight="bold">القدوة مش استنساخ: ثلاثة أنواع من الفعل</text>
<g font-size="23" text-anchor="middle">
<rect x="70" y="100" width="330" height="96" rx="14" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/><text x="235" y="138" fill="#e8f1f8">تشريعي — بلّغه</text><text x="235" y="170" fill="#bcd6e6" font-size="19">صلاة · صوم · مناسك · أحكام</text>
<rect x="435" y="100" width="330" height="96" rx="14" fill="#123a5c" stroke="#f2b134" stroke-width="3"/><text x="600" y="138" fill="#e8f1f8">عادي — بشر في زمانه</text><text x="600" y="170" fill="#bcd6e6" font-size="19">أكل الدباء · ثياب عصره · «أنتم أعلم بدنياكم»</text>
<rect x="800" y="100" width="330" height="96" rx="14" fill="#123a5c" stroke="#e05252" stroke-width="3"/><text x="965" y="138" fill="#e8f1f8">خصوصي — له وحده</text><text x="965" y="170" fill="#bcd6e6" font-size="19">ثبتت خصوصيته بنص</text>
</g>
<g font-size="21" fill="#bcd6e6" text-anchor="middle">
<rect x="120" y="226" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="260">حُكم الاتباع: اتباع واجب/مندوب ← اقتداء بالروح لا القالب ← إثبات بلا تقليد</text>
<rect x="120" y="294" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="328">مرض ١: تحويل العادي لتشريعي — يقدس عادة زمانهم ويجمد الدين</text>
<rect x="120" y="362" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="396">مرض ٢: إنكار التشريعي بحجة التاريخي — يذوب الدين في متحف</text>
<rect x="120" y="430" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="464">السؤال الصعب بميزان: سياق + أرقام ببطاقتها + تصنيف + «لا أعلم بعد»</text>
<rect x="120" y="498" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="532">الحاضرية غلط منهجي: لا تُحاكم أزمنة بمسطرة قرنك — ولا تبرر ظلمًا بـ«زمانهم»</text>
</g>
<text x="600" y="606" fill="#e8f1f8" font-size="22" text-anchor="middle">القدوة اتجاه قلب لا قالب شكل: «أسوة حسنة لمن كان يرجو الله واليوم الآخر»</text>
<text x="600" y="650" fill="#7fa3bb" font-size="18" text-anchor="middle">مشروع تأسيس — الوحدة 4 v0.4 — الأسبوع 15</text>
</svg>
