<rect x="620" y="200" width="170" height="74" rx="10" fill="#123a5c" stroke="#f2b134" stroke-width="2"/><text x="705" y="230">١٠ الشعب</text><text x="705" y="256" fill="#bcd6e6" font-size="16">حصار 3 سنين</text>
