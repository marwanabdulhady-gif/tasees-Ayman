<g font-size="21" fill="#bcd6e6" text-anchor="middle">
<rect x="120" y="418" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="452">قاعدة البناء: بذرة ← حاضنة ← صمود ← توسع ← انتقال</text>
<rect x="120" y="486" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="520">الترتيب منهج: الطائف بعد فقد السند · الإسراء بعد استنفاد الأسباب · الدولة بعد الفرد</text>
<rect x="120" y="554" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="588">مهمتك: علّم محطتك إنت على الخريطة — والخطوة الجاية الطبيعية مش المستعجلة</text>
</g>
<text x="600" y="652" fill="#7fa3bb" font-size="18" text-anchor="middle">مشروع تأسيس — الوحدة 4 v0.4 — الأسبوع 14 — بلا تجسيد</text>
