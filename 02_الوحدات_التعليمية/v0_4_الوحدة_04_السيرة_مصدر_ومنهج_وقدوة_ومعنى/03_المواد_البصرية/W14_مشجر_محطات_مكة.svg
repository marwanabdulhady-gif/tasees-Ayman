<rect x="440" y="310" width="360" height="74" rx="10" fill="#123a5c" stroke="#39c0ba" stroke-width="2"/><text x="620" y="340">١٤ الهجرة — نقل مركز</text><text x="620" y="366" fill="#bcd6e6" font-size="16">تخطيط + تخصص + دليل خبير</text>
