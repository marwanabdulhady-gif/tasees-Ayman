<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Cairo, sans-serif">
<rect width="1200" height="675" fill="#0e1b2e"/>
<text x="600" y="62" fill="#e8f1f8" font-size="36" text-anchor="middle" font-weight="bold">إزاي وصلتنا السيرة؟ طبقات المصدر ودرجات الخبر</text>
<g font-size="22" text-anchor="middle" fill="#e8f1f8">
<rect x="70" y="100" width="255" height="80" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/><text x="197" y="132">١ القرآن</text><text x="197" y="160" fill="#bcd6e6" font-size="18">محطات متواترة</text>
<rect x="345" y="100" width="255" height="80" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/><text x="472" y="132">٢ الحديث والسنة</text><text x="472" y="160" fill="#bcd6e6" font-size="18">أسانيد + علم رجال</text>
<rect x="620" y="100" width="255" height="80" rx="12" fill="#123a5c" stroke="#f2b134" stroke-width="3"/><text x="747" y="132">٣ المغازي والسير</text><text x="747" y="160" fill="#bcd6e6" font-size="18">ابن إسحاق/ابن هشام</text>
<rect x="895" y="100" width="235" height="80" rx="12" fill="#123a5c" stroke="#e05252" stroke-width="3"/><text x="1012" y="132">٤ مصنفات متأخرة</text><text x="1012" y="160" fill="#bcd6e6" font-size="18">تفاصيل بلا مصفاة أحيانًا</text>
</g>
<g font-size="22" fill="#bcd6e6" text-anchor="middle">
<rect x="120" y="212" width="960" height="56" rx="12" fill="#0f2740"/><text x="600" y="248">درجات الخبر: متواتر ← صحيح/حسن ← ضعيف ← موضوع (نادر ومفضوح)</text>
<rect x="120" y="282" width="960" height="56" rx="12" fill="#0f2740"/><text x="600" y="318">معياران بأمانة الأئمة: تشديد في الحلال والحرام · تساهل في السير والمغازي</text>
<rect x="120" y="352" width="960" height="56" rx="12" fill="#0f2740"/><text x="600" y="388">بطاقة الخبر: ١ سند · ٢ متن · ٣ مخارج · ٤ سياق · ٥ أثر — على قد الأثر تكون الصرامة</text>
<rect x="120" y="422" width="960" height="56" rx="12" fill="#0f2740"/><text x="600" y="458">خندقان: غلو يرفع فوق النص · جفاء يطرح دونه — والمنزل الوسط منهج</text>
<rect x="120" y="492" width="960" height="56" rx="12" fill="#0f2740"/><text x="600" y="528">علامة الوسطي: بيفرح بالتصحيح — «الخبر نزل درجة» مش «السيرة اتهدمت»</text>
</g>
<text x="600" y="628" fill="#7fa3bb" font-size="20" text-anchor="middle">مشروع تأسيس — الوحدة 4 v0.4 — الأسبوع 13 — بلا تجسيد</text>
</svg>
