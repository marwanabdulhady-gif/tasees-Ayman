<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img"
     aria-label="بطاقة الدعوى — سبع خانات تتفتح جولة جولة، وخانة «لا نعلم بعد» لا تُقبل فاضية">
<title>بطاقة الدعوى — المحكمة الختامية (الأسبوع ٣٦)</title>
<style>
  text{font-family:'IBM Plex Sans Arabic','Noto Sans Arabic',Tahoma,sans-serif}
  .title{font-family:'Aref Ruqaa','Amiri',serif;font-weight:700}
  .hs{cursor:pointer}
  .hs:focus{outline:none}
  .hs:hover,.hs:focus-visible{fill:#2440A0;fill-opacity:.08;stroke:#2440A0;stroke-width:1.4}
</style>
<rect x="12" y="12" width="616" height="376" rx="8" fill="#FFFFFF" stroke="#2440A0" stroke-width="1.6"/>
<text class="title" x="608" y="46" font-size="19" fill="#2440A0" text-anchor="end">بطاقة الدعوى</text>
<text x="608" y="68" font-size="12" fill="#4A5470" text-anchor="end">محكمة الأسبوع ٣٦: دعوى واحدة، سبع خانات — والخانة الخامسة لا تُقبل فاضية</text>
<rect x="32" y="84" width="576" height="52" rx="6" fill="#F7F8F3" stroke="#D7DDE8" stroke-width="1.2"/>
<text x="596" y="106" font-size="12.5" font-weight="700" fill="#20242C" text-anchor="end">الدعوى على الطاولة:</text>
<text x="596" y="124" font-size="12" fill="#4A5470" text-anchor="end">«إن التاريخ بيمشي بناس أعلى مننا، وإحنا مالنا في إيدينا حاجة»</text>
<g class="slot" data-i="1"><rect x="36" y="152" width="268" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="290" y="170" font-size="11" fill="#4A5470" text-anchor="start">نص الدعوى زي ما هي، بلا تحسين ولا تشويه</text><circle cx="594" cy="166" r="10" fill="none" stroke="#2440A0" stroke-width="1.4"/><text x="594" y="170" font-size="11" fill="#2440A0" text-anchor="middle">١</text><text x="576" y="170" font-size="12.5" fill="#20242C" text-anchor="end">الدعوى — صياغتها بكلماتها</text><rect class="hs" data-i="1" x="36" y="152" width="268" height="28" fill="none" pointer-events="all"/></g>
<g class="slot" data-i="2"><rect x="36" y="184" width="268" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="290" y="202" font-size="11" fill="#4A5470" text-anchor="start">إيه اللي ثبت؟ وبأي درجة؟</text><circle cx="594" cy="198" r="10" fill="none" stroke="#2440A0" stroke-width="1.4"/><text x="594" y="202" font-size="11" fill="#2440A0" text-anchor="middle">٢</text><text x="576" y="202" font-size="12.5" fill="#20242C" text-anchor="end">الوقائع ودرجتها</text><rect class="hs" data-i="2" x="36" y="184" width="268" height="28" fill="none" pointer-events="all"/></g>
<g class="slot" data-i="3"><rect x="36" y="216" width="268" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="290" y="234" font-size="11" fill="#4A5470" text-anchor="start">إيه اللي تفسير مش واقعة؟</text><circle cx="594" cy="230" r="10" fill="none" stroke="#2440A0" stroke-width="1.4"/><text x="594" y="234" font-size="11" fill="#2440A0" text-anchor="middle">٣</text><text x="576" y="234" font-size="12.5" fill="#20242C" text-anchor="end">التفسير</text><rect class="hs" data-i="3" x="36" y="216" width="268" height="28" fill="none" pointer-events="all"/></g>
<g class="slot" data-i="4"><rect x="36" y="248" width="268" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="290" y="266" font-size="11" fill="#4A5470" text-anchor="start">إيه اللي دليله ضعيف؟</text><circle cx="594" cy="262" r="10" fill="none" stroke="#2440A0" stroke-width="1.4"/><text x="594" y="266" font-size="11" fill="#2440A0" text-anchor="middle">٤</text><text x="576" y="266" font-size="12.5" fill="#20242C" text-anchor="end">الضعيف</text><rect class="hs" data-i="4" x="36" y="248" width="268" height="28" fill="none" pointer-events="all"/></g>
<g class="slot" data-i="5"><rect x="36" y="280" width="268" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="290" y="298" font-size="11" fill="#4A5470" text-anchor="start">خانة لا تُقبل فاضية</text><circle cx="594" cy="294" r="10" fill="none" stroke="#2440A0" stroke-width="1.4"/><text x="594" y="298" font-size="11" fill="#2440A0" text-anchor="middle">٥</text><text x="576" y="298" font-size="12.5" fill="#20242C" text-anchor="end">لا نعلم بعد</text><rect class="hs" data-i="5" x="36" y="280" width="268" height="28" fill="none" pointer-events="all"/></g>
<g class="slot" data-i="6"><rect x="36" y="312" width="268" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="290" y="330" font-size="11" fill="#4A5470" text-anchor="start">فعل واحد صغير ومقيس</text><circle cx="594" cy="326" r="10" fill="none" stroke="#2440A0" stroke-width="1.4"/><text x="594" y="330" font-size="11" fill="#2440A0" text-anchor="middle">٦</text><text x="576" y="330" font-size="12.5" fill="#20242C" text-anchor="end">ما يترتب عليه عمل</text><rect class="hs" data-i="6" x="36" y="312" width="268" height="28" fill="none" pointer-events="all"/></g>
<g class="slot" data-i="7"><rect x="36" y="344" width="268" height="28" rx="4" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="290" y="362" font-size="11" fill="#4A5470" text-anchor="start">لو اتقال قدام أهلك وأهل الطرف التاني — هيقف؟</text><circle cx="594" cy="358" r="10" fill="none" stroke="#2440A0" stroke-width="1.4"/><text x="594" y="362" font-size="11" fill="#2440A0" text-anchor="middle">٧</text><text x="576" y="362" font-size="12.5" fill="#20242C" text-anchor="end">الأدب</text><rect class="hs" data-i="7" x="36" y="344" width="268" height="28" fill="none" pointer-events="all"/></g>
<text x="608" y="382" font-size="11" fill="#4A5470" text-anchor="end">مفيش دور اسمه «الحكم» — البطاقة هي اللي بتصدر، مش حكمًا</text>
</svg>
