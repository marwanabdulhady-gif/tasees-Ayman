<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Cairo, sans-serif">
<rect width="1200" height="675" fill="#0e1b2e"/>
<text x="600" y="64" fill="#e8f1f8" font-size="38" text-anchor="middle" font-weight="bold">سفر المعرفة: ورشة · مخزن · مستورد</text>
<g font-size="24" text-anchor="middle">
<rect x="80" y="110" width="320" height="90" rx="14" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/><text x="240" y="148" fill="#e8f1f8">ورشة: ترجمة + شرح</text><text x="240" y="180" fill="#bcd6e6">+ اعتراض بأسماء حاضرة</text>
<rect x="440" y="110" width="320" height="90" rx="14" fill="#123a5c" stroke="#f2b134" stroke-width="3"/><text x="600" y="148" fill="#e8f1f8">مخزن: نقل بلا فحص</text><text x="600" y="180" fill="#bcd6e6">«ويقولون…» بلا صاحب</text>
<rect x="800" y="110" width="320" height="90" rx="14" fill="#123a5c" stroke="#e05252" stroke-width="3"/><text x="960" y="148" fill="#e8f1f8">مستورد: ثبوت مجرد</text><text x="960" y="180" fill="#bcd6e6">«ثبت عند…» بلا سند</text>
</g>
<g font-size="22" fill="#bcd6e6" text-anchor="middle">
<rect x="120" y="240" width="960" height="60" rx="12" fill="#0f2740"/><text x="600" y="278">قنوات الإرسال: الأندلس · صقلية · طليطلة · الترجمات · الطباعة</text>
<rect x="120" y="316" width="960" height="60" rx="12" fill="#0f2740"/><text x="600" y="354">أسماء الجمّالة تُشطب في الطريق ← النسيان يقطع السند</text>
<rect x="120" y="392" width="960" height="60" rx="12" fill="#0f2740"/><text x="600" y="430">سطر الجمّالة: صاحب الفكرة · طريق الوصول · حدّك أنت</text>
<rect x="120" y="468" width="960" height="60" rx="12" fill="#0f2740"/><text x="600" y="506">ملف الوحدة 2: فهرس ١ ورقات + خريطة + بطاقة رقم + قيمة حاكمة + سطر صراحة</text>
</g>
<text x="600" y="630" fill="#7fa3bb" font-size="20" text-anchor="middle">مشروع تأسيس — الوحدة 2 v0.4 — الأسبوع 8</text>
</svg>
