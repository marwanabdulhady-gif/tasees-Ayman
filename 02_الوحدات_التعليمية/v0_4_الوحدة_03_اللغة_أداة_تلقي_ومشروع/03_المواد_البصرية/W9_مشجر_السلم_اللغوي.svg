<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Cairo, sans-serif">
<rect width="1200" height="675" fill="#0e1b2e"/>
<text x="600" y="64" fill="#e8f1f8" font-size="38" text-anchor="middle" font-weight="bold">لغتك عين مش قميص: سلّم درجات لا خنادق</text>
<g font-size="24" text-anchor="middle">
<rect x="70" y="104" width="330" height="84" rx="14" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/><text x="235" y="140" fill="#e8f1f8">الرسالة</text><text x="235" y="172" fill="#bcd6e6">وحي وتجربة — لا تتولد من اللغة</text>
<rect x="440" y="104" width="330" height="84" rx="14" fill="#123a5c" stroke="#f2b134" stroke-width="3"/><text x="605" y="140" fill="#e8f1f8">الطريق</text><text x="605" y="172" fill="#bcd6e6">لغتي — تُصان وتُفحص ولا تُقدَّس</text>
<rect x="810" y="104" width="320" height="84" rx="14" fill="#123a5c" stroke="#e05252" stroke-width="3"/><text x="970" y="140" fill="#e8f1f8">الخلط</text><text x="970" y="172" fill="#bcd6e6">تقديس يتجمد أو ازدراء يضيع</text>
</g>
<g stroke="#39c0ba" stroke-width="4" fill="none"><path d="M400 146 H435"/><path d="M770 146 H805"/></g>
<g font-size="22" fill="#bcd6e6" text-anchor="middle">
<rect x="120" y="220" width="960" height="56" rx="12" fill="#0f2740"/><text x="600" y="256">درجات السلّم: بيت ← سوق ← شغل ← خطبة — تتحرك عليها كل يوم</text>
<rect x="120" y="290" width="960" height="56" rx="12" fill="#0f2740"/><text x="600" y="326">خطران: التجمد على درجة · احتقار درجة إنت واقف عليها</text>
<rect x="120" y="360" width="960" height="56" rx="12" fill="#0f2740"/><text x="600" y="396">الكلمة الشحنة = انطباع ملفوظ ← بطاقة 5 خانات + سؤال الجار</text>
<rect x="120" y="430" width="960" height="56" rx="12" fill="#0f2740"/><text x="600" y="466">الدواء: حوّل الملصق لوصف سلوك قابل للنقاش والتغيير</text>
<rect x="120" y="500" width="960" height="56" rx="12" fill="#0f2740"/><text x="600" y="536">مهمة: خريطة لساني + درجة واحدة أتقنها — عادة على موعد</text>
</g>
<text x="600" y="630" fill="#7fa3bb" font-size="20" text-anchor="middle">مشروع تأسيس — الوحدة 3 v0.4 — الأسبوع 9</text>
</svg>
