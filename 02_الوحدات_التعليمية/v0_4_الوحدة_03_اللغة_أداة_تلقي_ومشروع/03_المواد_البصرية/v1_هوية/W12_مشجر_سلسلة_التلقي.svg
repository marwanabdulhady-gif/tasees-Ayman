<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" style="direction:rtl" font-family="'IBM Plex Sans Arabic', 'Noto Sans Arabic', Tahoma, sans-serif">
  <defs><pattern id="v1grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" fill="none" stroke="#D7DDE8" stroke-width="0.7"/></pattern>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2440A0"/></marker>
  </defs>
  <rect width="1200" height="850" fill="#F7F8F3"/><rect width="1200" height="850" fill="url(#v1grid)"/>
  <text x="600" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#19213A">مشجر الأسبوع ٤ — سلسلة التلقي المسؤول (ملخص الوحدة)</text>
  <text x="600" y="82" text-anchor="middle" font-size="17" fill="#4A5470">العلم مش محاضرة مبهرة — عادة جماعية بتتكرر في مكان متواضع · مشروع تأسيس · الوحدة 1 · v0.3</text>

  <!-- the unit chain -->
  <g font-size="16" font-weight="700" fill="#19213A">
    <rect x="70" y="115" width="160" height="70" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="150" y="146" text-anchor="middle">سؤال</text><text x="150" y="170" text-anchor="middle" font-size="12" font-weight="400">أسبوع ١</text>
    <rect x="250" y="115" width="160" height="70" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="330" y="146" text-anchor="middle">خريطة</text><text x="330" y="170" text-anchor="middle" font-size="12" font-weight="400">سؤال←علم←فجوة←عادة</text>
    <rect x="430" y="115" width="160" height="70" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="510" y="146" text-anchor="middle">وصف بلا وسم</text><text x="510" y="170" text-anchor="middle" font-size="12" font-weight="400">أسبوع ٢</text>
    <rect x="610" y="115" width="160" height="70" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="690" y="146" text-anchor="middle">دعوى مفكوكة</text><text x="690" y="170" text-anchor="middle" font-size="12" font-weight="400">أسبوع ٣</text>
    <rect x="790" y="115" width="160" height="70" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="870" y="146" text-anchor="middle">تلقٍ مسؤول</text><text x="870" y="170" text-anchor="middle" font-size="12" font-weight="400">أسبوع ٤</text>
    <rect x="970" y="115" width="160" height="70" rx="6" fill="#FFFFFF" stroke="#20242C" stroke-width="1.5" stroke-dasharray="4 3"/><text x="1050" y="146" text-anchor="middle">عادة تعيش</text><text x="1050" y="170" text-anchor="middle" font-size="12" font-weight="400">١٤/٣٠ يومًا</text>
  </g>
  <g stroke="#2440A0" stroke-width="2.5" fill="none" marker-end="url(#arw)">
    <path d="M230,150 L244,150"/><path d="M410,150 L424,150"/><path d="M590,150 L604,150"/><path d="M770,150 L784,150"/><path d="M950,150 L964,150"/>
  </g>

  <!-- branch A: source 4 questions -->
  <text x="310" y="248" text-anchor="middle" font-size="23" font-weight="700" fill="#19213A">قبل ما تقرا: ٤ أسئلة على المصدر</text>
  <g font-size="16" fill="#19213A">
    <rect x="80" y="268" width="220" height="78" rx="6" fill="#FFFFFF" stroke="#2440A0" stroke-width="3"/><text x="190" y="300" text-anchor="middle" font-weight="700" fill="#19213A">١. بيقدملي إيه؟</text><text x="190" y="328" text-anchor="middle" font-size="13">رواية/منهج/حكم/شهادة؟</text>
    <rect x="320" y="268" width="220" height="78" rx="6" fill="#FFFFFF" stroke="#2440A0" stroke-width="3"/><text x="430" y="300" text-anchor="middle" font-weight="700" fill="#19213A">٢. في أنهي مجال؟</text><text x="430" y="328" text-anchor="middle" font-size="13">الفقهي فقه — مش فيزياء</text>
  </g>
  <g font-size="16" fill="#19213A">
    <rect x="80" y="366" width="220" height="78" rx="6" fill="#FFFFFF" stroke="#2440A0" stroke-width="3"/><text x="190" y="398" text-anchor="middle" font-weight="700" fill="#19213A">٣. إيه حدّه؟</text><text x="190" y="426" text-anchor="middle" font-size="13">إيه اللي ما بيقدمهوش؟</text>
    <rect x="320" y="366" width="220" height="78" rx="6" fill="#FFFFFF" stroke="#2440A0" stroke-width="3"/><text x="430" y="398" text-anchor="middle" font-weight="700" fill="#19213A">٤. مين المكمل؟</text><text x="430" y="426" text-anchor="middle" font-size="13">مصدر تاني من زاوية تانية</text>
  </g>
  <rect x="80" y="464" width="460" height="56" rx="6" fill="#FFFFFF" stroke="#C23B30" stroke-width="2"/>
  <text x="310" y="488" text-anchor="middle" font-size="16" font-weight="700" fill="#C23B30">لا تسليم كامل (إجازة عقلية) ولا حرق كامل (تعصب مقلوب)</text>
  <text x="310" y="510" text-anchor="middle" font-size="14" fill="#4A5470">الطريقة الثالثة: الوظيفة والحد — AT-10 (PDF ص547–583)</text>

  <!-- branch B: dialogue protocol -->
  <text x="870" y="248" text-anchor="middle" font-size="23" font-weight="700" fill="#19213A">بروتوكول الحوار المنصف — ٥ خطوات</text>
  <g font-size="15" fill="#19213A">
    <rect x="650" y="268" width="460" height="52" rx="10" fill="#FFFFFF" stroke="#2440A0" stroke-width="2"/><text x="880" y="300" text-anchor="middle">١. قول دعوى التاني زي ما هو شايفها (steelman لا رجل قش)</text>
    <rect x="650" y="332" width="460" height="52" rx="10" fill="#FFFFFF" stroke="#2440A0" stroke-width="2"/><text x="880" y="364" text-anchor="middle">٢. لخّص لحد ما هو نفسه يقولك: آه، ده أنا</text>
    <rect x="650" y="396" width="460" height="52" rx="10" fill="#FFFFFF" stroke="#2440A0" stroke-width="2"/><text x="880" y="428" text-anchor="middle">٣. فرّق: ثابت / تفسير / قيمة / مجهول</text>
    <rect x="650" y="460" width="460" height="52" rx="10" fill="#FFFFFF" stroke="#2440A0" stroke-width="2"/><text x="880" y="492" text-anchor="middle">٤. قول حدّك وقراءة بديلة معقولة</text>
    <rect x="650" y="524" width="460" height="52" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="880" y="556" text-anchor="middle">٥. اقفل بخطوة تعلم — لا بانتصار</text>
  </g>

  <!-- bottom: habit plan -->
  <text x="600" y="618" text-anchor="middle" font-size="23" font-weight="700" fill="#19213A">الخطة الصغيرة اللي تعيش</text>
  <g font-size="16" fill="#19213A">
    <rect x="80" y="638" width="500" height="106" rx="6" fill="#FFFFFF" stroke="#2440A0" stroke-width="3"/>
    <text x="330" y="670" text-anchor="middle" font-weight="700" fill="#19213A">خطة ١٤ يومًا</text>
    <text x="330" y="698" text-anchor="middle" font-size="14">فعل واحد صغير · مكان وميعاد · مصدر واحد · هدف واحد</text>
    <text x="330" y="722" text-anchor="middle" font-size="14">رفيق اختياري — مش رقيب</text>

    <rect x="620" y="638" width="500" height="106" rx="6" fill="#FFFFFF" stroke="#20242C" stroke-width="3" stroke-dasharray="4 3"/>
    <text x="870" y="670" text-anchor="middle" font-weight="700" fill="#20242C">مراجعة ٣٠ يومًا</text>
    <text x="870" y="698" text-anchor="middle" font-size="14">ربع ساعة: إيه اللي حصل؟ إيه اللي عطّلني؟ أعدّل إيه؟</text>
    <text x="870" y="722" text-anchor="middle" font-size="14">حق التعديل وحق التوقف — الخطة خادم ليك</text>
  </g>

  <rect x="80" y="762" width="1040" height="54" rx="6" fill="#FFFFFF" stroke="#D7DDE8"/>
  <text x="600" y="786" text-anchor="middle" font-size="14" fill="#4A5470">المصادر: 02/01+02/02 دورة الوعي اللغوي (مدرسة شيخ العمود — العباسية) · 05/18 مدخل لعلوم العربية · 05/36 التأسيس المعرفي والجماعات الوسيطة · AT-10 لهفة التلقي</text>
  <text x="600" y="808" text-anchor="middle" font-size="13" fill="#4A5470">ملف نهاية الوحدة: سؤال + مصدر واحد على الأقل + حد + قراءة بديلة + فعل منخفض المخاطر · مادة بصرية أصلية لمشروع تأسيس — تعليمي داخلي · v0.3 · هوية v1</text>
</svg>
