<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Cairo, sans-serif">
<rect width="1200" height="675" fill="#0e1b2e"/>
<text x="600" y="60" fill="#e8f1f8" font-size="36" text-anchor="middle" font-weight="bold">أدوات القراءة: 4 وظائف · 7 قوالب · 4 خطوات</text>
<g font-size="22" text-anchor="middle" fill="#e8f1f8">
<rect x="60" y="96" width="255" height="72" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/><text x="187" y="126">فاعل — مين عمل</text><text x="187" y="152" fill="#bcd6e6" font-size="18">«الولدُ» بالضمة</text>
<rect x="335" y="96" width="255" height="72" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/><text x="462" y="126">مفعول — في مين</text><text x="462" y="152" fill="#bcd6e6" font-size="18">«الولدَ» بالفتحة</text>
<rect x="610" y="96" width="255" height="72" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/><text x="737" y="126">مضاف إليه — بتاع مين</text><text x="737" y="152" fill="#bcd6e6" font-size="18">«المدينةِ» بالكسرة</text>
<rect x="885" y="96" width="255" height="72" rx="12" fill="#123a5c" stroke="#39c0ba" stroke-width="3"/><text x="1012" y="126">صفة/حال — إزاي وأنيه</text><text x="1012" y="152" fill="#bcd6e6" font-size="18">«المسلحون» بالواو</text>
</g>
<g font-size="21" fill="#bcd6e6" text-anchor="middle">
<rect x="120" y="196" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="230">القوالب السبع: فَعَّلَ تكرار · أَفْعَلَ إدخال · فاعَلَ مشاركة · انْفَعَلَ استجابة · افْتَعَلَ اتخاذ · تَفَعَّلَ تدرج · اسْتَفْعَلَ طلب</text>
<rect x="120" y="264" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="298">استغسل = طلب من غيره غسله — الوزن يختصر جملة في كلمة</text>
<rect x="120" y="332" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="366">الأربع خطوات: ١ صوت (ودنك أولًا) ← ٢ هيكل ← ٣ جذر ← ٤ أثر</text>
<rect x="120" y="400" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="434">السؤال الصحي: النص عمل فيّ إيه؟ — مش: ماذا قصد الشاعر؟</text>
<rect x="120" y="468" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="502">الكثيف يطلع معنى كل قراءة · الغامض ما يطلعش — الشغل بيبان</text>
<rect x="120" y="536" width="960" height="54" rx="12" fill="#0f2740"/><text x="600" y="570">الضمير من غير مرجع واضح = لغم — قف واسأل قبل ما توقّع</text>
</g>
<text x="600" y="640" fill="#7fa3bb" font-size="20" text-anchor="middle">مشروع تأسيس — الوحدة 3 v0.4 — الأسبوع 11</text>
