<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" style="direction:rtl" font-family="'IBM Plex Sans Arabic', 'Noto Sans Arabic', Tahoma, sans-serif">
  <defs><pattern id="v1grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" fill="none" stroke="#D7DDE8" stroke-width="0.7"/></pattern>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2440A0"/></marker>
  </defs>
  <rect width="1200" height="850" fill="#F7F8F3"/><rect width="1200" height="850" fill="url(#v1grid)"/>
  <text x="600" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#19213A">إنفوجراف الأسبوع ٢ — تشريح فكرة: من عالم الأفكار إلى الواقع</text>
  <text x="600" y="82" text-anchor="middle" font-size="17" fill="#4A5470">الفكرة لا تقعد ساكتة في دماغك — بتشتغل · مشروع تأسيس · الوحدة 1 · v0.3</text>

  <!-- chain: idea world to destiny -->
  <g font-size="17" font-weight="700" fill="#19213A">
    <rect x="80" y="115" width="140" height="62" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="150" y="143" text-anchor="middle">فكرة</text><text x="150" y="165" text-anchor="middle" font-size="12" font-weight="400">تفسير جاهز</text>
    <rect x="250" y="115" width="140" height="62" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="320" y="143" text-anchor="middle">انفعال</text><text x="320" y="165" text-anchor="middle" font-size="12" font-weight="400">قبل الفحص</text>
    <rect x="420" y="115" width="140" height="62" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="490" y="143" text-anchor="middle">قرار</text><text x="490" y="165" text-anchor="middle" font-size="12" font-weight="400">بناءً عليه</text>
    <rect x="590" y="115" width="140" height="62" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="660" y="143" text-anchor="middle">تصرف</text><text x="660" y="165" text-anchor="middle" font-size="12" font-weight="400">مرة واتنين</text>
    <rect x="760" y="115" width="140" height="62" rx="6" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="830" y="143" text-anchor="middle">عادة</text><text x="830" y="165" text-anchor="middle" font-size="12" font-weight="400">تتكرر</text>
    <rect x="930" y="115" width="190" height="62" rx="12" fill="#FFFFFF" stroke="#2440A0" stroke-width="2"/><text x="1025" y="143" text-anchor="middle">شخصية ← مصير</text><text x="1025" y="165" text-anchor="middle" font-size="12" font-weight="400">السلسلة الكاملة</text>
  </g>
  <g stroke="#2440A0" stroke-width="2.5" fill="none" marker-end="url(#arw)">
    <path d="M250,146 L228,146"/><path d="M420,146 L398,146"/><path d="M590,146 L568,146"/><path d="M760,146 L738,146"/><path d="M930,146 L908,146"/>
  </g>
  <text x="600" y="208" text-anchor="middle" font-size="14" fill="#4A5470">الزحزة الواحدة في الشارع → تفسيرات مختلفة → أيام مختلفة · راجع تفريغ 05/45 «تغيير عالم الأفكار»</text>

  <!-- versus: وصف / وسم -->
  <text x="600" y="268" text-anchor="middle" font-size="27" font-weight="700" fill="#19213A">الوصف ≠ الوسم — قاعدة الوحدة الذهبية</text>

  <g font-size="16" fill="#19213A">
    <rect x="80" y="290" width="500" height="240" rx="6" fill="#FFFFFF" stroke="#2440A0" stroke-width="3"/>
    <text x="330" y="326" text-anchor="middle" font-size="24" font-weight="700" fill="#19213A">الوصف ✓ يبني</text>
    <text x="330" y="362" text-anchor="middle">كلام عن فعل محدد أو حالة محددة أو مؤسسة محددة</text>
    <text x="330" y="392" text-anchor="middle">له شاهد يمكن التحقق منه (من؟ فين؟ امتى؟ الدليل؟)</text>
    <text x="330" y="422" text-anchor="middle">يقبل التفصيل والرجعة والتصحيح</text>
    <text x="330" y="452" text-anchor="middle">«في المعاملة دي ربا وتدليس» — فعل + معيار</text>
    <text x="330" y="488" text-anchor="middle" font-size="14" fill="#4A5470">مثال حي: تعريف أيمن بنفسه — كليات وسنين وأقسام،</text>
    <text x="330" y="510" text-anchor="middle" font-size="14" fill="#4A5470">كلها أفعال قابلة للتحقق (تفريغ 05/35)</text>

    <rect x="620" y="290" width="500" height="240" rx="6" fill="#FFFFFF" stroke="#C23B30" stroke-width="3"/>
    <text x="870" y="326" text-anchor="middle" font-size="24" font-weight="700" fill="#C23B30">الوسم ✗ يهدم</text>
    <text x="870" y="362" text-anchor="middle">اسم شامل على إنسان أو جماعة أو دولة</text>
    <text x="870" y="392" text-anchor="middle">بلا شاهد — يستلف ثقته من النبرة ومن التكرار</text>
    <text x="870" y="422" text-anchor="middle">يقفل السؤال ويعطّل العقل قبل الفحص</text>
    <text x="870" y="452" text-anchor="middle">«دول كسالى» «الجيل ده ضاع» — حكم على وجود</text>
    <text x="870" y="488" text-anchor="middle" font-size="14" fill="#4A5470">الوسم مش بس ظلم للناس — الوسم صناعة الفتن:</text>
    <text x="870" y="510" text-anchor="middle" font-size="14" fill="#4A5470">بالترتيب الغلط لا بالكذب · الكذب يتكشف والترتيب يعيش</text>
  </g>

  <!-- diagnostic card -->
  <text x="600" y="588" text-anchor="middle" font-size="24" font-weight="700" fill="#19213A">بطاقة التشخيص — خمسون خانة في دقيقة</text>
  <g font-size="16" font-weight="700" fill="#19213A">
    <rect x="80" y="608" width="196" height="66" rx="6" fill="#FFFFFF" stroke="#20242C" stroke-width="1.5" stroke-dasharray="4 3"/><text x="178" y="638" text-anchor="middle">وصف</text><text x="178" y="660" text-anchor="middle" font-size="12" font-weight="400">الفعل والشاهد</text>
    <rect x="296" y="608" width="196" height="66" rx="6" fill="#FFFFFF" stroke="#20242C" stroke-width="1.5" stroke-dasharray="4 3"/><text x="394" y="638" text-anchor="middle">معيار</text><text x="394" y="660" text-anchor="middle" font-size="12" font-weight="400">بأي قيمة نقيس</text>
    <rect x="512" y="608" width="196" height="66" rx="6" fill="#FFFFFF" stroke="#20242C" stroke-width="1.5" stroke-dasharray="4 3"/><text x="610" y="638" text-anchor="middle">دليل</text><text x="610" y="660" text-anchor="middle" font-size="12" font-weight="400">من مصدره الأصلي</text>
    <rect x="728" y="608" width="196" height="66" rx="6" fill="#FFFFFF" stroke="#20242C" stroke-width="1.5" stroke-dasharray="4 3"/><text x="826" y="638" text-anchor="middle">بديل</text><text x="826" y="660" text-anchor="middle" font-size="12" font-weight="400">تفسير منافس</text>
    <rect x="944" y="608" width="176" height="66" rx="6" fill="#FFFFFF" stroke="#20242C" stroke-width="1.5" stroke-dasharray="4 3"/><text x="1032" y="638" text-anchor="middle">أثر التسمية</text><text x="1032" y="660" text-anchor="middle" font-size="12" font-weight="400">من يتضرر؟</text>
  </g>

  <!-- ladder -->
  <rect x="80" y="700" width="1040" height="60" rx="6" fill="#FFFFFF" stroke="#D7DDE8"/>
  <text x="600" y="728" text-anchor="middle" font-size="17" fill="#19213A">سلّم «الجاهلية» في المصدر: ملاحظة ← معيار ← حكم لاهوتي على ظاهرة ← (قف!) الوسم على الناس مرفوض دينًا وعقلًا وإنسانية</text>
  <text x="600" y="750" text-anchor="middle" font-size="14" fill="#4A5470">المفهوم المعياري أداة قياس في حدود سياقها — لا تسمية للأشخاص · AT-01 (PDF ص54–99)</text>

  <text x="600" y="800" text-anchor="middle" font-size="15" fill="#4A5470">المصادر: 05/44 «حقيقة الأشياء» · 05/35 «إفساد عقول الشباب» · 05/45 «تغيير عالم الأفكار» · خيط AT-01 · راجع الأصول قبل النشر</text>
  <text x="600" y="826" text-anchor="middle" font-size="13" fill="#4A5470">مادة بصرية أصلية لمشروع تأسيس — ترخيص الاستعمال: تعليمي داخلي · v0.3 · هوية v1</text>
</svg>
