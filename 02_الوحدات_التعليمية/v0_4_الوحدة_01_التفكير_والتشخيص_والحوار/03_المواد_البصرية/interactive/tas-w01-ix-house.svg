<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img"
     aria-label="بيت مقطعي: لمبة وسلك ولافتة بلا كتابة وعلبة القاطع الرئيسي — حالتا ضلمة ونور">
<title>البيت المقطعي — مصيدة التشخيص الغلط (الأسبوع ١)</title>
<style>
  text{font-family:'IBM Plex Sans Arabic','Noto Sans Arabic',Tahoma,sans-serif}
  .lbl{fill:#4A5470;font-size:12px}
  .cap{fill:#4A5470;font-size:11.5px}
  .ink{fill:none;stroke:#19213A;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .rule{fill:none;stroke:#D7DDE8;stroke-width:1.4;stroke-linecap:round}
  .bulb{fill:#D7DDE8;stroke:#2440A0;stroke-width:1.6}
  .glow{fill:#2E7D57;opacity:0}
  .dark-note{fill:#C23B30}
  .lit-note{fill:#2E7D57;opacity:0}
  .lever{stroke:#C23B30;stroke-width:4;stroke-linecap:round}
  .is-lit .glow{opacity:.16}
  .is-lit .bulb{fill:#2E7D57;stroke:#2E7D57}
  .is-lit .lever{stroke:#2E7D57}
  .is-lit .lit-note{opacity:1}
  .is-lit .dark-note{opacity:0}
  .hs{fill:none;cursor:pointer}
  .hs:hover,.hs:focus-visible{fill:#2440A0;fill-opacity:.08;stroke:#2440A0;stroke-width:1.4}
</style>
<rect x="0" y="0" width="640" height="380" fill="#F7F8F3"/>
<path class="ink" d="M40,330 H600"/>
<path class="ink" d="M110,180 L270,80 L430,180"/>
<path class="ink" d="M130,180 V330 H410 V180"/>
<rect class="ink" x="230" y="250" width="80" height="80" rx="2"/>
<circle cx="296" cy="292" r="3" fill="#19213A"/>
<line class="ink" x1="270" y1="120" x2="270" y2="150"/>
<circle class="glow" cx="270" cy="163" r="54"/>
<circle class="bulb" cx="270" cy="163" r="13"/>
<path class="ink" d="M283,163 H310 C400,163 430,176 470,190"/>
<rect class="ink" x="470" y="190" width="64" height="96" rx="4"/>
<line class="ink" x1="490" y1="208" x2="514" y2="208"/>
<line class="ink" x1="490" y1="268" x2="514" y2="268"/>
<line class="lever" x1="502" y1="224" x2="502" y2="256"/>
<line class="ink" x1="70" y1="150" x2="70" y2="330"/>
<rect class="ink" x="24" y="150" width="92" height="54" rx="3"/>
<line class="rule" x1="270" y1="176" x2="270" y2="192"/>
<text class="lbl" x="270" y="206" text-anchor="middle">اللمبة</text>
<line class="rule" x1="380" y1="163" x2="380" y2="152"/>
<text class="lbl" x="380" y="146" text-anchor="middle">السلك</text>
<text class="lbl" x="70" y="224" text-anchor="middle" style="font-size:11px">لافتة بلا كتابة</text>
<text class="lbl" x="502" y="306" text-anchor="middle" style="font-size:11px">القاطع الرئيسي</text>
<text class="cap dark-note" x="320" y="360" text-anchor="middle">البيت ضلمة — وكل واحد بيصلّح حاجة، والزرار اللي محدش بص عليه</text>
<text class="cap lit-note" x="320" y="360" text-anchor="middle">البيت نور — المشكلة كلها كانت زرار: القاطع رجع مكانه</text>
<rect class="hs" data-i="1" x="238" y="146" width="64" height="48" tabindex="0"/>
<rect class="hs" data-i="2" x="308" y="150" width="156" height="42" tabindex="0"/>
<rect class="hs" data-i="3" x="24" y="150" width="92" height="54" tabindex="0"/>
<rect class="hs" data-i="4" x="470" y="190" width="64" height="96" tabindex="0"/>
<script type="text/javascript"><![CDATA[
(function () {
  var s = document.querySelector('svg'), b = s.querySelector('.hs[data-i="4"]');
  function toggle() { s.classList.toggle('is-lit'); }
  b.addEventListener('click', toggle);
  b.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });
})();
]]></script>
</svg>
